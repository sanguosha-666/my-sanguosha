name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node run_all_tests.js
        env:
          CACHE_BUST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
