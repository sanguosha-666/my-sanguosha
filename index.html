<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>极简三国杀 · 多人联机</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon-180.png">

<!-- Firebase (compat build, loaded from Google's CDN). These only run when you DEPLOY this file. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
  :root{
    --ink:#1a1714; --ink-soft:#2c2722; --paper:#e9e1d2; --paper-dim:#cabfa8;
    --cinnabar:#b1361e; --cinnabar-bright:#d8492c; --gold:#b08d4f;
    --jade:#5f7a5a; --line:rgba(233,225,210,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  /* 安全区(env(safe-area-inset-*)):横屏下 iPhone 的刘海/手势条位于屏幕两侧和底部,
     之前完全没有处理(实测 body 的 padding-left/right/bottom 都是 0px)。配合 <head>
     里 viewport-fit=cover(允许页面内容延伸到安全区之外、由页面自己负责避让),这里给
     body 补上四个方向的 env() padding——不支持 env() 的浏览器/非刘海设备上,env() 求值
     为 0,不影响任何现有布局;真正的横屏刘海设备上才会生效,让出两侧/底部的安全空间。 */
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2420 0%, var(--ink) 60%),
      var(--ink);
    color:var(--paper);
    font-family:"Songti SC","Noto Serif SC",ui-serif,"STSong",serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100%;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 40px;}

  h1{
    font-size:30px;letter-spacing:.28em;text-indent:.28em;font-weight:700;
    margin:6px 0 2px;text-align:center;
  }
  h1 .seal{
    display:inline-block;background:var(--cinnabar);color:var(--paper);
    border-radius:6px;padding:0 .18em;margin-right:.25em;
    box-shadow:0 0 0 2px rgba(216,73,44,.35);
  }
  .sub{text-align:center;color:var(--paper-dim);font-size:13px;letter-spacing:.18em;margin-bottom:18px;}

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.12));
    border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  }

  label{display:block;font-size:12px;letter-spacing:.14em;color:var(--paper-dim);margin:0 0 6px;}
  input{
    width:100%;background:#15120f;border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--gold);}

  button{
    font-family:inherit;cursor:pointer;border-radius:9px;border:1px solid transparent;
    padding:9px 16px;font-size:14px;letter-spacing:.08em;background:#241f1b;color:var(--paper);
    border-color:var(--line);transition:transform .06s ease, background .15s;
  }
  button:hover:not(:disabled){background:#2e2823;}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--cinnabar);border-color:var(--cinnabar-bright);}
  /* primary 按钮被 disable 时,仅靠 opacity 淡化朱红看起来还是"暗红"而非"灰"(specificity 打平,
     opacity 和 background 不是同一属性、不会互相覆盖)。这里用更高优先级(.primary:disabled)
     强制换成中性暗色背景,让 disabled 真正显示为灰色/暗淡,不再是变暗的红。 */
  button.primary:disabled{background:#241f1b;border-color:var(--line);}
  button.primary:hover:not(:disabled){background:var(--cinnabar-bright);}
  button.ghost{background:transparent;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row>div{flex:1;min-width:120px;}

  /* ===== 骨架级重建:横屏、对手横行同屏显示(landscape-ui 第1阶段:座位卡渲染)=====
     参考图驱动的信息架构,取代之前 grid 环绕布局那一版(旧的 .seats/.opp1/.opp2 网格
     模板整体废弃)。对手不再分"1个/2个对手用不同grid模板"两套,统一用 flex 横排,
     人数弹性靠 flex:1 1 0 平分,不需要按人数切换不同的布局规则——这是这次改动相比
     旧版更简单的地方(旧版要为每种对手数量单独维护一套 grid-template-areas)。
     .opp-row 只装对手(不含"我"),render.js 按 g.players.length 动态渲染,不管房间
     里实际有几个人,这个容器本身不关心具体是2人局还是7人局。
     可读性下限的推导(不是拍脑袋定的):静态HTML mockup实测过,7人局最坏情况
     (iPhone SE横屏667px宽、6个对手同屏)每张卡约97.8px时,标题栏/头像/血量/装备
     全部清晰可辨,90px定为下限留一点安全余量。max-width 防止人少时(2人局只有1个
     对手)卡片被拉得过宽显得空洞。overflow-x:auto 是安全网,不是预期会触发的主路径——
     按这套算法,2-7人局在常见横屏宽度下都不需要触发它。 */
  .opp-row{
    display:flex; gap:8px; padding:8px 8px 4px;
    overflow-x:auto; overflow-y:hidden;
  }
  /* #game 是这次 render-table.js 飞牌/连线动画坐标计算的相对定位基准(阶段1的最小必要
     修复:原来的基准 #seats 这次已经被移除,不加这条飞牌/连线会找不到容器直接报错——
     这不是阶段2"把中央出牌区改造成独立横向长条"那个完整设计,只是保证阶段1不因为
     容器改名而彻底崩掉;阶段2会重新审视这个基准是否需要换成别的共同祖先容器)。 */
  #game{position:relative;}
  /* ===== 中央出牌区——骨架级重建阶段2:独立横条 =====
     阶段1只是把 #tableCard 从废弃的 grid 体系里挪出来、保证不崩(临时占位,无持久外观)。
     阶段2要做的是让它在参考图意义上真正读成一条"独立横条区域"——始终占满整行宽度、
     自带一条常驻的暗色"台面"背景+上下细线分隔,不管此刻有没有牌在结算都能看出这是
     布局里固定的一块区域,而不是"有牌才浮现、没牌就完全不存在的空白"。

     关键设计取舍:"常驻的台面背景"和"牌内容的淡入淡出"必须是两个独立的视觉层,不能
     揉进同一个 opacity 开关里——如果直接把背景画在 .table-card 自己身上,而 .table-card
     的 opacity 又要在空闲时归零(现有淡出机制的核心),背景会跟着牌一起消失,达不到
     "常驻台面"的效果。所以新增一层外层容器 #tableStrip(纯静态包装,不参与任何JS状态),
     背景/边框/最小高度全部画在这一层;#tableCard 完全保留原样(id、class、里面的
     opacity/animation 逻辑、render-table.js 一行都不用改),嵌套在 #tableStrip 内部,
     只负责"这批牌具体长什么样、什么时候淡入淡出",两层各司其职、不会互相覆盖。

     坐标基准复用 #game(阶段1已经确认这是 Stage2 也会用的那个共同祖先,不需要重新
     迁移一次)——这次改动只加了一层纯展示的静态包装 div,不影响 #tableCard 本身在
     DOM 树里相对 #game 的关系(#tableCard 依然是 #game 的后代,getBoundingClientRect
     的相对定位计算不受影响),render-table.js 因此不需要任何改动。 */
  .table-strip{
    width:100%;
    min-height:64px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,15,10,.55);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:4px 8px;
    box-sizing:border-box;position:relative;
  }
  .discard-reveal{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;padding:5px 8px;box-sizing:border-box;
    background:rgba(20,15,10,.94);opacity:0;pointer-events:none;overflow:hidden;}
  .discard-reveal.show{animation:discardRevealFade var(--discard-reveal-ms,1500ms) ease forwards;}
  .discard-reveal-title{font-size:13px;color:var(--paper-dim);}
  .discard-reveal-cards{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap;}
  .discard-reveal-card{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .discard-reveal-card .table-card-mini{width:52px;height:72px;}
  .table-strip:has(.discard-reveal.show){min-height:108px;}
  @keyframes discardRevealFade{
    0%{opacity:0;transform:scale(.96);} 8%{opacity:1;transform:scale(1);}
    86%{opacity:1;} 100%{opacity:0;}
  }
  .table-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;text-align:center;width:100%;
    opacity:0;pointer-events:none;
    min-height:48px;
    line-height:1.1;
  }
  .table-card.show{ animation:tableCardFade 2.6s ease forwards; }
  @keyframes tableCardFade{
    0%{opacity:0;transform:scale(.9);}
    10%{opacity:1;transform:scale(1);}
    80%{opacity:1;}
    100%{opacity:0;}
  }
  .table-card-who{font-size:13px;color:var(--paper-dim);}
  .table-card-name{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.06em;}
  .table-card-face{font-size:17px;margin-top:2px;}
  /* 横排/竖排布局只取决于"这批牌有几张",和链有没有结束(idle/是否在淡出)完全无关——
     这是一次真实bug修复后的结论,原来布局属性(display:flex;flex-direction:row;...)挂在
     .exchange-mode 上、由 render-table.js 的 idle 判断切换 class 来控制,而 hasNewEntry
     (有没有新牌加入)和 idle(链是否结束)可能在同一次调用里同时触发(最简单的例子:出杀
     后对方打闪抵消,"闪被推入exchangeCards"和"链判定为已结束"是同一次tx/render)——这种
     情况下 exchange-mode 被同一时刻移除,容器退回默认的 flex-direction:column,两张牌在
     竖排布局下一起淡出,而不是横排。用 :has() 选择器直接按子元素数量决定布局,不再依赖
     JS 切换的 class,从根源解耦"布局"和"该不该淡出"这两件互不相关的事——用相邻兄弟选择器
     .exchange-card + .exchange-card 精确匹配"至少2张",1张牌时不触发,保持原来单张牌的
     竖排展示不受影响。 */
  .table-card:has(.exchange-card + .exchange-card){
    display:flex;flex-direction:row;gap:6px;flex-wrap:wrap;
    justify-content:center;align-items:flex-start;
  }
  /* 结算链进行中(不限于南蛮入侵/万箭齐发的应战链、决斗的连续出杀——任何还没结束的结算链
     都算,由 render-table.js 按 !g.pending&&!g.aoe 判断):不淡出(exchange-mode 时
     animation:none,静态常驻)。链结束的那一刻(render-table.js 检测到空闲)才切成 .show
     触发一次性的整体淡出——exchange-mode 现在只剩这一个职责(布局已经交给上面的 :has()
     规则,不再声明 display/flex-direction 等布局属性),但 render-table.js 里"idle 时移除
     exchange-mode"这一步仍然保留,原因不是布局(布局现在不受影响),而是 animation 属性本身
     的优先级冲突:.exchange-mode{animation:none} 和 .show{animation:tableCardFade...}
     选择器优先级相同(都是 .table-card 加一个类,(0,2,0)),源码顺序上 exchange-mode 写在
     show 后面,如果两个 class 同时挂着,exchange-mode 的 animation:none 会按后来居上的规则
     赢过 show,导致淡出动画整个不播放——这条互斥移除是为了避开这个真实存在的属性冲突,不是
     心血来潮的"看起来该有";数据本身(g.exchangeCards)何时被清空是完全独立的另一件事,由
     game.js 的 pruneExchangeCards(tx写入路径专属,不在 render路径的normalize里)负责,
     不影响这里的视觉动画节奏。 */
  .table-card.exchange-mode{animation:none;opacity:1;}
  .exchange-card{background:var(--ink-soft);border:1px solid var(--gold);border-radius:8px;
    padding:4px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  /* 中央出牌区的迷你卡牌:复用 .card/.card-art-box/.corner/.no-art 已有的插画+角标+降级样式,
     只覆盖尺寸——比手牌小一号,不需要手牌那套按视口自适应字号的逻辑(中央区没有标题栏文字,
     牌名已经单独用 .table-card-name 显示在上方)。cursor:default 且不绑定 onclick,纯展示。 */
  .table-card-mini{width:64px;height:88px;cursor:default;margin:0 auto;}
  /* 中央出牌区的角标必须自带不透明底衬,手牌区不需要——这不是重复保险,是两者结构不同:
     手牌 .card 里 .corner(top:0;left:0)正好压在 .card-title 上,而 .card-title 是
     rgba(0,0,0,.15) 叠在 .card 的 #f1ead9 奶白底上(仍是浅色),所以 cardFace 的深色花色
     (黑#3a2f28/红#b33,本来就是为奶白卡面设计的)在手牌上清晰可读(实测黑10.8)。
     但 tableCardFaceHtml 产出的 mini 卡【没有 .card-title】(牌名单独用 .table-card-name
     显示在卡片上方),角标于是直接压在暗色插画上 —— 实测8张卡面黑/红两色对比度只有
     1.07~2.51,全部远低于 WCAG AA 的 4.5,肉眼看就是"只有图片、没有花色"。
     底衬必须【不透明】:半透明底衬的对比度会随背后插画明暗漂移,这个坑本项目在座位卡
     血量胶囊上已经踩过一次(rgba(...,.42)在最亮立绘上只有2.30、最暗立绘上4.60),
     教训是"保证对比度的那一层必须不透明,背后是什么图就与它无关"。取 #f1ead9(=.card
     自己的底色),视觉上像卡纸透出来、和手牌区观感一致,不额外引入新颜色。
     实测(8张卡面×红黑双色,底衬亮度恒为0.8256、完全不随插画变化):黑10.83 / 红4.82,
     全部≥4.5。红色余量较小(4.82)但仍达标,且明显优于手牌区红花色的现状(3.43,压在
     .card-title 上,一直如此、从未有人反馈过可读性问题)——cardFace 的红黑配色是共用的,
     这次不动它(保留花色颜色这个规则相关信息)。
     不加 border-radius:.card 自己有 border-radius:10px + overflow:hidden,外侧圆角已经
     被卡片裁掉了;若在这里再加圆角,圆角外会漏出暗插画(实测会把角标区域的像素采样污染,
     一度把红色对比度误测成12.33)。 */
  .table-card-mini .corner{font-size:12px;min-width:21px;height:21px;padding:0 2px;}
  .table-card-mini .mount-role{width:20px;height:20px;right:2px;bottom:2px;font-size:12px;border-width:1px;}
  .exchange-card .table-card-mini{width:52px;height:72px;}
  /* #tableCard 默认是纯展示层(pointer-events:none)，五谷牌池则是真正的交互区；
     进入该模式时必须恢复命中测试，否则按钮看得见却永远收不到点击。 */
  .table-card.wugu-pool-mode{width:100%;max-width:none;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:auto;}
  .wugu-pool-title{font-size:16px;font-weight:700;color:var(--gold);}
  .wugu-pool{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px;width:100%;}
  .wugu-pool-card{margin:0;padding:5px;background:rgba(22,17,12,.9);border:1px solid var(--line);border-radius:9px;color:var(--paper);}
  button.wugu-pool-card{cursor:pointer;}
  button.wugu-pool-card.selectable{border-color:var(--gold);box-shadow:0 0 0 1px rgba(197,151,71,.35),0 4px 12px rgba(0,0,0,.35);}
  button.wugu-pool-card.selectable:hover{transform:translateY(-7px) scale(1.06);background:#2b2118;}
  button.wugu-pool-card:disabled{opacity:.65;cursor:wait;}
  .wugu-card-name{font-size:13px;font-weight:700;color:var(--gold);text-align:center;padding:0 2px 4px!important;white-space:nowrap;}
  .wugu-pool-card .table-card-mini{margin:0 auto;}
  /* 飞牌动画的临时元素(feature/table-ui 第4步):position:absolute 相对 #seats(已加
     position:relative)定位,left/top 由 render.js 运行时用 getBoundingClientRect 算好的
     像素坐标赋值,这里只定义外观和过渡时长。transition 时长(.6s)比 renderTableCard 里
     setTimeout 移除的 650ms 略短,确保透明度先降到0再被摘除,不会出现"瞬间消失"的跳变。 */
  .flying-card{position:absolute;transform:translate(-50%,-50%);
    background:var(--ink-soft);border:1px solid var(--gold);border-radius:8px;
    padding:4px 10px;font-size:13px;color:var(--paper);white-space:nowrap;
    pointer-events:none;z-index:30;
    transition:left .6s ease,top .6s ease,opacity .6s ease .3s;}
  /* 目标连线的 SVG overlay(feature/table-ui 第5步):position:absolute 覆盖 #seats(同飞牌
     动画依赖 #seats 的 position:relative),pointer-events:none 不拦截下面座位卡片的点击。
     线本身用 CSS animation 做"画出后淡出"的效果,和 #tableCard 的 2.6s 节奏对齐。 */
  .target-lines{position:absolute;top:0;left:0;pointer-events:none;z-index:25;}
  .target-line{stroke:var(--gold);stroke-width:2;opacity:0;
    animation:targetLineFade 2.6s ease forwards;}
  @keyframes targetLineFade{
    0%{opacity:0;}
    15%{opacity:.85;}
    70%{opacity:.85;}
    100%{opacity:0;}
  }
  /* 实际扣血反馈:震动/红闪由卡片承担,剑痕和伤害数字用伪元素覆盖，不改变座位布局。 */
  .seat.damage-hit{animation:damageHitShake .62s cubic-bezier(.36,.07,.19,.97);}
  .seat.damage-hit::before{content:"";position:absolute;z-index:45;pointer-events:none;
    left:-12%;top:47%;width:124%;height:5px;border-radius:50%;
    background:linear-gradient(90deg,transparent 4%,#fff 30%,#ffd4b8 48%,#d4261b 55%,transparent 92%);
    box-shadow:0 0 7px #fff,0 0 16px #d4261b;transform:rotate(-24deg) scaleX(0);
    animation:damageSlash .5s ease-out forwards;}
  .seat.damage-hit.damage-hit::after{content:"−" attr(data-damage-amount);position:absolute;z-index:46;
    left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;
    color:#fff;font-size:clamp(28px,4vw,48px);font-weight:900;line-height:1;
    text-shadow:0 2px 2px #510000,0 0 8px #ff2a1d,0 0 18px #b00000;
    animation:damageNumber .7s ease-out forwards;}
  @keyframes damageHitShake{
    0%,100%{transform:translate(0,0);filter:none;} 12%{transform:translate(-7px,2px);filter:brightness(1.65) sepia(.7) saturate(3);}
    25%{transform:translate(7px,-2px);} 38%{transform:translate(-5px,1px);} 52%{transform:translate(4px,-1px);}
    68%{transform:translate(-2px,0);filter:brightness(1.15) sepia(.25) saturate(1.5);}
  }
  @keyframes damageSlash{0%{opacity:0;transform:rotate(-24deg) scaleX(0);}18%{opacity:1;}55%{transform:rotate(-24deg) scaleX(1);}100%{opacity:0;transform:rotate(-24deg) scaleX(1.08);}}
  @keyframes damageNumber{0%{opacity:0;transform:translate(-50%,-20%) scale(.6);}18%{opacity:1;transform:translate(-50%,-50%) scale(1.18);}65%{opacity:1;}100%{opacity:0;transform:translate(-50%,-105%) scale(.92);}}
  /* ===== 座位卡片(第3次布局):武将立绘铺满整卡 + 文字叠加在图片上层 =====
     **这是本项目第三次采用"文字叠在武将立绘上"的设计。前两次(头像铺满整卡 / 头像居左
     固定大块)都因为"文字盖在可变内容图片上导致可读性差"而主动放弃(见CLAUDE.md两轮
     记录),上一版(头像缩小成角落小图、文字全部挪到图片框外)正是为了从根上避开这个
     问题。这次是在完全知情的前提下有意识地做回来,不是不知情地重踩旧坑。**

     **这次能成立的关键,是换了一套前两次没用对的手法:保证对比度的是"文字和图片之间的
     那一层"(backing layer),不是文字本身的描边。** 前两次都试图靠"半透明小色块 + 文字
     描边"硬顶,这在深色立绘上勉强能看、在中间调/浅色立绘上必然失效(描边和半透明底都
     依赖背后的明暗,背后一变就失效)。这次每个文字元素都有自己的底衬层,其中**装备条是
     完全不透明的白底**——不透明意味着"背后是什么立绘"对它的对比度毫无影响,这是唯一
     能保证"在任意立绘上都看得清"的手法,也正是前两次缺的那一环。

     逐元素的可读性方案(每一项都必须有 backing layer,不能只靠 text-shadow):
       标题栏  -> .seat-scrim-top 顶部深色渐变遮罩打底 + text-shadow
       武将名  -> 落在顶部遮罩的深色区内 + text-shadow
       血量    -> 位置在卡片中部,顶部/底部遮罩都够不到,所以它自带近乎不透明的深色胶囊底衬
       装备条  -> **白色文字 + .seat-scrim-bottom 底部深色渐变垫底**(第5次微调:原来是
                  不透明白底条,现在改成白字直接叠在立绘下半部,由这层渐变承担对比度保证)
       判定区  -> 自带半透明深色底衬(同血量思路)

     **第5次微调把装备条从"不透明白底+深色字"换成"白字+底部深色渐变垫底"。这一步是有
     风险的——原来的白底是"完全不透明",对比度和背后立绘数学上无关(实测最亮/最暗立绘
     10.58 vs 10.58,差值 0.00);换成渐变之后,渐变是半透明的,理论上对比度会重新依赖
     背后立绘的明暗,正是本项目前两次栽跟头的那个模式。所以这层渐变的强度不是拍脑袋定的,
     是按"最亮的立绘 + 最多的装备行数(4行) + 最小的卡片"这个最坏组合反推、并程序化实测
     出来的**(实测数据见 CLAUDE.md 本次条目)。**要点:渐变必须在整个装备文字区域内都
     足够暗,不能只压住最下面一两行、让第3~4行跑到渐变已经变淡的亮区去。**

     卡片宽高比锁 3:4 跟随立绘素材(素材实测:40张里24张是3:4、16张是2:3,3:4是多数派;
     2:3的那16张会被 object-fit:cover 从底部裁掉约11%高度——底部本来就落在装备文字区
     的深色渐变里,实际损失很小,且 object-position:center top 保证头部完整不被裁)。 */
  .seat{
    background:#1d1916;border:1px solid var(--line);
    border-radius:10px;position:relative;overflow:hidden;
    aspect-ratio:3/4;          /* 卡片形状跟随立绘素材比例(见上方说明) */
    flex:1 1 0;min-width:90px;max-width:200px; /* 对手行弹性收缩,见 .opp-row 的可读性下限说明 */
    container-type:inline-size; /* 配合下方的 @container 分档,见 .seat.me 之后那一段说明 */
  }
  .seat.active{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade) inset;} /* 当前行动者:绿色高亮 */
  .seat.dead{opacity:.45;filter:grayscale(.6);}
  /* 曹植【酒诗】等翻面:faceup===false 时 render.js 加 .flipped */
  .seat.flipped{filter:brightness(.72) saturate(.75);box-shadow:0 0 0 2px #6b5b4d inset;}
  .seat.flipped::after{content:'翻面';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font-size:12px;font-weight:700;color:#f2efe6;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px;pointer-events:none;}
  /* 出牌方/目标座位的短暂高亮(中央出牌区同一节奏淡出),这两条沿用不变,不受这次
     卡片结构改动影响——outline 是独立的盒模型外层视觉层,和 border/box-shadow 不冲突。 */
  .seat.table-actor{outline:2px solid var(--cinnabar-bright);outline-offset:2px;transition:outline-color .3s;}
  .seat.table-target{outline:2px solid var(--gold);outline-offset:2px;transition:outline-color .3s;}
  /* 立绘:铺满整卡作为视觉主体。object-position:center top 保证头部永远完整保留
     (裁切只发生在底部,而底部本来就被装备条盖住)。 */
  .seat-art{position:absolute;inset:0;overflow:hidden;background:#15120f;}
  .seat-art .avatar{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .seat-art .avatar-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:4px;font-size:10px;color:var(--paper-dim);background:#241f1b;}
  /* 顶部/底部渐变遮罩:纯装饰层,不拦截点击(pointer-events:none,否则会挡住底下
     .seat 的目标选择点击和装备/判定区 chip 的 onclick)。
     **第7次微调:本想把顶部/底部渐变都改成半透明,底部做到了(见下面 .seat-scrim-bottom
     的说明),顶部这里实测发现基本没有下调空间——已如实报告给用户,这里先按原值(第3次
     布局定的 .80/.45/0)维持不变,不是自己偷偷决定的。**
     实测过程:标题栏文字(.seat-title,含玩家名)在最亮立绘(马超,对手卡200px/11px字号,
     即 WCAG AA 校验一直用的那个最坏样本)上的对比度,随第一个渐变阶段(0%处的α值,
     决定标题栏这个贴在顶部的元素能拿到多少不透明度)几乎线性下降:α=.80(原值)时
     4.62~4.66,α=.79时已经卡在4.50这个边界值(浮点误差下判定失败),α=.78时4.43,
     α=.65(最初尝试的起点)时更只有2.1~2.7——**这条余量几乎是零,不是"风险",是已经
     实测证明的硬约束**:标题栏紧贴在渐变最顶端(y=0),该处不透明度约等于渐变第一个
     阶段的α值本身,不存在"往后面的阶段调整、前面留白处不受影响"这种绕开办法。
     这和底部渐变的情况不同——装备文字/手牌图标数字位置更靠下、渐变本身覆盖范围更大
     (60%卡高 vs 这里的34%),有更多空间可以调整。 */
  .seat-scrim-top{position:absolute;top:0;left:0;right:0;height:34%;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.80) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,0) 100%);}
  /* **底部渐变(第7次微调:从第5/6次微调确立的"近乎不透明"改成半透明,主动例外)。**
     第5/6次微调的立论是"底衬必须不透明,不能依赖背后立绘明暗"——这条规则本身没有错,
     被两次真实的可读性失败(头像铺满整卡/头像居左固定大块)反复验证过。**这次是用户
     在完全知情这条规则和其历史教训的前提下,明确要求"阴影要透出立绘"**——这是一次
     主动的、知情的例外,不是像前两次那样不知情地踩坑,所以没有违背这条规则的精神
     (规则的精神是"不要在不知情的情况下假设半透明能顶住",而不是"永远不能用半透明")。
     **半透明意味着对比度会重新依赖背后立绘的明暗**,所以这次同样必须逐行实测(桌面+
     SE两档、含全场最亮的大乔),如果测不到 WCAG AA 的 4.5,不能自己悄悄调深凑合,
     要停下来问用户——这次的实测数据见 CLAUDE.md 第7次微调条目。
     装备栏这次不再"撑满"(第6次微调那种目标已经被这次的改动取代,4行装备缩回到
     和其它文字协调的小字号),所以渐变覆盖高度不需要再迁就"最上面一行贴着渐变顶部"
     这个几何约束,可以用更简单直白的分布。 */
  .seat-scrim-bottom{position:absolute;bottom:0;left:0;right:0;height:60%;pointer-events:none;
    background:linear-gradient(0deg,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.50) 40%,
      rgba(0,0,0,.42) 65%,
      rgba(0,0,0,.20) 85%,
      rgba(0,0,0,0) 100%);}
  /* 标题栏:叠在顶部遮罩上(不再自带背景色,对比度由遮罩保证)。
     **第7次微调:①删掉标题栏右侧的数字血量(.seat-title-hp)**——血量已经在左侧
     .seat-hp-col 的竖排心形图标里完整显示,标题栏再放一遍数字是冗余信息,删掉不影响
     任何功能,纯粹的信息去重。**②玩家名从靠左改成居中**:标题栏删掉血量数字之后,
     `justify-content:space-between` 不再有意义(右侧没有东西可以"对齐到两端"了),
     改成 `justify-content:center` 让名字真正居中;回合/连环/濒死这几个状态标签
     (tags)不参与这次居中——它们只在特定状态下才出现,如果和名字挤在同一个居中
     flex流里,标签的出现/消失会导致名字左右晃动(不是真正的居中,而是"扣掉标签宽度
     后居中"),所以改成绝对定位钉在标题栏右侧(见下面 .seat-title-tags),不占据
     居中布局的flex空间,名字才能稳定居中、不受标签有无影响。 */
  .seat-title{
    position:absolute;top:0;left:0;right:0;
    color:var(--paper);font-weight:700;
    padding:3px 5px;display:flex;align-items:center;justify-content:center;
    white-space:nowrap;overflow:hidden;font-size:11px;
    text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8);
  }
  .seat-title-name{overflow:hidden;text-overflow:ellipsis;text-align:center;}
  /* 状态标签(回合中/连环/濒死):绝对定位钉在标题栏右侧,不参与上面的居中flex布局
     (理由见 .seat-title 的说明)。标题栏本身已经是 position:absolute 的定位上下文,
     子元素可以直接相对它定位。 */
  .seat-title-tags{position:absolute;top:50%;right:5px;transform:translateY(-50%);
    display:flex;gap:3px;}
  /* ===== 左侧一列(第4次微调):玩家名(在标题栏里,靠左) → 势力/所属占位 → 武将名竖排 → 血量 =====
     **这四样(除玩家名在标题栏外)包成一个竖直 flex 列,不再各自写死绝对定位的 top 偏移量。**
     这是真实踩到的坑逼出来的:武将名竖排的高度随字数变化(2字"马超" vs 4字"颜良文丑"差一倍),
     而血量胶囊原来是"垂直居中"的绝对定位——在矮的对手卡上(SE 横屏下仅 128.66px 高),
     3~4 字的武将名会直接和血量胶囊叠在一起。**这个重叠在上一轮 PR#20 里其实就已经存在,
     只是当时的验证截图恰好都用了 2 字武将名(马超/大乔)而没暴露出来**;这次新增势力占位
     把武将名往下推之后才被测试断言抓到。用 flex 列让它们自然依次往下排,字数怎么变都不会
     撞车,也不需要任何"武将名大概多高"的魔数——和 .seat-bottom(判定区+装备条)当初解决
     同一类问题用的是同一套办法。 */
  .seat-left{
    position:absolute;top:20px;left:4px;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  /* .seat-faction 是"武将所属势力"(魏/蜀/吴/群/晋)标识,第2步已回填内容。
     有内容时(class 带 faction-xxx)= 不透明色块 + 白字单字;无内容时(空 div)= 不可见空壳
     (大厅/选将未开局阶段,内容为空,不占视觉)。
     **色块不透明是硬要求**:它落在顶部遮罩已经变淡的区域,实测该位置背景亮度在不同立绘上
     会漂移(最亮machao 0.025 / 最暗simayi 0.0006),半透明色块的对比度会跟着漂(血量胶囊
     那次的教训:.42 半透明在最亮立绘上只有2.30)。不透明色块的白字对比度恒定、和背后立绘
     无关(实测已证明色块亮度跨立绘零差异)。文字白色,配色见 .faction-* 各势力。 */
  .seat-faction{
    width:14px;height:14px;flex:none;
    display:flex;align-items:center;justify-content:center;
    border-radius:3px; color:#fff; font-weight:700;
    font-size:10px; line-height:1;  /* 单个汉字,约色块×0.72;各断点色块缩小时字号同步缩,见下 */
  }
  .seat-faction:empty{ background:none; }  /* 空壳(未开局/无将):不画色块,维持不可见 */
  /* 五势力配色(A方案,统一白字,均实测白字对比≥4.5):
     蜀红/吴绿直接复用调色板 --cinnabar/--jade;魏蓝新增;群金加深到 #7d5f2a(--gold 原色
     #b08d4f 白字只有3.10不达标);晋深紫(当前0武将,框架预留,比座位紫 #8B5FBF 更深、不撞)。 */
  .faction-wei{ background:#3a5f8a; }  /* 魏·蓝  白字6.60 */
  .faction-shu{ background:var(--cinnabar); }  /* 蜀·朱红 白字6.15 */
  .faction-wu{ background:#5f7a5a; }  /* 吴·玉绿(=--jade) 白字4.75 */
  .faction-qun{ background:#7d5f2a; }  /* 群·加深金 白字5.93 */
  .faction-jin{ background:#5a3a7a; }  /* 晋·深紫 白字9.05(预留) */
  /* .inline-faction(第3步·3a/3b):势力小色块,和 .seat-faction 共用 .faction-* 配色/对比度,
     但用于文字行内联展示(#myGeneral、说明弹窗),不是卡片绝对定位——尺寸按行内文字调小,
     margin 撑开与相邻文字的间距,vertical-align 让色块和同一行的汉字基线对齐不错位。 */
  .inline-faction{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.35em; height:1.35em; border-radius:3px; color:#fff; font-weight:700;
    font-size:.72em; line-height:1; vertical-align:-.15em; margin:0 3px;
  }
  /* 武将名竖排:writing-mode:vertical-rl 让字符纵向堆叠,text-orientation:upright
     保证汉字保持正常朝向(不随竖排旋转90度)。现在是 .seat-left 这个 flex 列里的一项
     (排在势力占位之下、血量之上),不再自己写绝对定位。固定字号(非动态测量)——武将名
     长度上限被 GENERALS 表锁定(实测最长"颜良文丑"4字)。 */
  .seat-gen-name{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:11px;font-weight:700;color:var(--paper);letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8);
    flex:none;
  }
  /* 血量:纵向堆叠,贴左侧中部。**这是唯一一个顶部/底部遮罩都够不到的文字元素**,所以
     它必须自带底衬。
     **底衬用近乎不透明的深色(.88),不是半透明——这是实测逼出来的修正,不是保守选择。**
     第一版这里用的是 rgba(0,0,0,.42) 半透明,程序化测出来:在最亮的两张立绘上对比度只有
     3.87(马超)和 2.30(大乔),**双双低于 WCAG AA 的 4.5**,在暗立绘上却有 4.60 —— 也就是
     说它的可读性直接取决于背后立绘的明暗。**这恰恰就是前两次"文字叠图片"失败的那个根因,
     被我自己在这一个元素上重新引入了一遍**(整套方案的立论就是"底衬必须不透明、对比度
     不能依赖背后的图",装备条做到了,血量这里却退回了半透明)。改成 .88 之后不透明度足够高,
     对比度基本不再随立绘变化。这条记录留在这里,是因为它精确说明了"为什么这次的方案必须
     坚持不透明底衬"——一旦某个元素破例用半透明,那个元素就会重蹈覆辙。 */
  /* **底衬(rgba(18,12,8,.88) 近乎不透明)和配色这次一个字都没动**——这是上一轮用数据
     钉死的结论(半透明 .42 时在最亮立绘上对比度只有 2.30,低于 WCAG AA)。这次改的只有
     "它排在哪里":从"绝对定位垂直居中"改成"作为 .seat-left 这个 flex 列的最后一项",
     因为居中定位会和字数变长的武将名竖排撞在一起(见 .seat-left 的说明)。 */
  .seat-hp-col{
    display:flex;flex-direction:column;align-items:center;gap:0;
    font-size:11px;line-height:1.15;color:#ff6a4d;
    background:rgba(18,12,8,.88);border-radius:999px;padding:3px 3px;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
    flex:none;
  }
  .seat-hp-col .empty{color:#7d6a5c;}
   /* ===== 右上角:身份(主公/忠臣/反贼/内奸) =====
      空壳时不可见;identity 模式且 canSeeRole 时填单字+不透明底色(白字)。 */
   .seat-identity{
     position:absolute;top:20px;right:4px;
     width:16px;height:16px;   /* 正方形,内容为空时不可见 */
     display:flex;align-items:center;justify-content:center;
     font-size:10px;font-weight:700;line-height:1;
     border-radius:3px;color:#fff;
   }
   .seat-identity:empty{ background:none; border:none; color:transparent; }
   .seat-identity.role-zhu{ background:#b08d4f; }   /* 金 */
   .seat-identity.role-zhong{ background:#c45c26; } /* 橙红 */
   .seat-identity.role-fan{ background:#3d7a4a; }   /* 绿 */
   .seat-identity.role-nei{ background:#4a5a6a; }   /* 蓝灰 */
    /* 组队模式队伍角标:右上角,色块背景+队伍号(team模式下身份块为空,此位置空闲;
       右下角是出牌顺序号 .seat-order-badge,不能重叠) */
    .seat-team{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:4px;color:#fff;
      font-size:12px;font-weight:700;line-height:22px;text-align:center;z-index:6;}
   .seat-team:empty{display:none;}
   /* ===== CORE-115:身份猜测标记(玩家自己对某座位身份的个人猜测,identity模式专属) =====
      位置:卡片中心偏下(top:58%,不是正50%)——真中心已经被 .flipped::after("翻面"文字,
      同样 translate(-50%,-50%) 定在50%,50%)和罕见的 .seat-autopilot-badge(top:30%±,
      高度可达卡片中段)占用,58%这个位置留出足够间隙,三者理论上仍可能同时出现(翻面+
      托管+已标记),但都是各自独立的低频/瞬时状态,不追求把全部组合情况都错开,和
      .flipped::after 当初的取舍一致。
      **不透明底衬是硬要求**(#1a1410,和 .info-badge 同一色值,已验证过对比度不随立绘
      漂移,见 CLAUDE.md"每个可见元素都要有自己的不透明底衬"的既定原则)——因为放在
      卡片中心,这里正是立绘细节最丰富、明暗差异最大的区域,半透明底衬会重蹈血量胶囊
      当年"最亮立绘2.30对比度不达标"的覆辙。
      尺寸用 clamp(...,cqw,...) 而不是逐个 @container/@media 断点手写(装备条同款做法,
      见 .seat-equip-bar 的说明)——按卡片自身宽度连续缩放,不需要为每个新增断点补一行。
      **仅在鼠标可点击语境下"入口"和"已设置的标记"都归这一个元素**:未标记时显示
      🔖图标(半透明降低视觉权重,不抢镜),已标记时显示忠/反/内单字(不透明100%);
      两种状态的可点击区域和位置完全一致，不需要区分"入口"和"标记显示"两个元素。 */
   .seat-identity-mark{
     position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);
     width:clamp(18px,16cqw,30px);height:clamp(18px,16cqw,30px);border-radius:50%;
     display:flex;align-items:center;justify-content:center;
     font-size:clamp(9px,8cqw,15px);font-weight:700;line-height:1;
     background:#1a1410;border:2px dashed var(--gold);color:var(--paper);
     cursor:pointer;z-index:8;opacity:.55;
   }
   .seat-identity-mark.has-mark{opacity:1;}
   .seat.me .seat-identity-mark{width:clamp(22px,14cqw,34px);height:clamp(22px,14cqw,34px);font-size:clamp(11px,7cqw,17px);}
   /* 忠/反/内 三个选项的自定义弹窗(openIdentityMarkMenu,复用 #confirmModal 容器):
      横向排布4个可选按钮+1个取消,和默认的"确定/取消"两按钮布局(.confirm-btns 基础
      规则)不冲突——.confirm-btns 本身已是 flex+gap 的按钮行,这里不需要额外布局规则,
      只加一条"当前已选中的选项"高亮标记,复用 button.ghost 已有的样式做底子。 */
   .identity-mark-btns button.identity-mark-current{border-color:var(--gold);color:var(--gold);}
  /* "?"说明入口(第4次微调:从标题栏挪到这里——右上角、身份方块的正下方)。
     **它在这个新位置上落在顶部遮罩几乎完全透明的区域**(实测 SE 对手卡在该 y 坐标处
     scrim alpha≈0,等于直接压在裸立绘上),所以**必须自带不透明底衬**——通用 .info-badge
     本身已经带了 background:#1a1410(不透明十六进制色,不是 rgba 半透明)+金色描边,正好
     满足本方案"每个可见元素都要有自己的不透明底衬、不能只靠 text-shadow/半透明色块"
     这条硬要求。这里只覆盖尺寸和定位,**绝不能把那个不透明背景覆盖掉**(一旦改成半透明,
     就会重蹈血量胶囊那次的覆辙:最亮立绘上对比度掉到 2.30,低于 WCAG AA)。
     遮罩本身是 pointer-events:none,所以点击能正常穿透到这里;z-index 保证它叠在遮罩之上。 */
  /* **选择器必须写成 .seat .seat-info-badge(而不是光秃秃的 .seat-info-badge)**——
     通用 .info-badge 的基础规则(width:22px)在本文件里出现在**这一段之后**,两者
     specificity 相同(都是单个类,(0,1,0)),同优先级下**源码顺序在后的赢**,于是尺寸会被
     基础规则的 22px 盖掉、这里写多少都不生效(在 SE 窄屏上直接把小卡片撑爆——这是被
     测试断言真实抓到的,不是理论担心)。加一层 .seat 前缀提到 (0,2,0) 才压得住。
     CLAUDE.md 里早就记过 .info-badge 这条"基础规则写在断点之后导致断点失效"的坑,
     这次是同一个坑的另一种表现形式。 */
  .seat .seat-info-badge{
    position:absolute;top:40px;right:4px;
    width:14px;height:14px;font-size:9px;
    z-index:2;
  }
  /* 托管是公开状态：立绘变灰，所有玩家都能看到机器人和“在偷懒”标识。 */
  /* 只做轻度灰化，不降低整卡透明度；避免和 .seat.dead 的阵亡效果混淆。 */
  .seat.autopilot .seat-art .avatar{filter:grayscale(.55) brightness(.88) contrast(.95);}
  .seat.autopilot .seat-art .avatar-placeholder{filter:grayscale(.55) brightness(.88);}
  .seat-autopilot-badge{
    position:absolute;top:30%;left:14%;right:14%;transform:translateY(-50%);
    box-sizing:border-box;padding:8px 10px;display:flex;align-items:center;justify-content:center;
    column-gap:4px;border:1px solid var(--gold);border-radius:7px;background:#1a1410;
    color:var(--paper);line-height:1;z-index:7;pointer-events:none;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.9);
  }
  .seat-autopilot-robot{font-size:23px;}
  .seat-autopilot-lazy{font-size:21px;font-weight:700;color:var(--gold);white-space:nowrap;}
  .seat.me .seat-autopilot-badge{left:12%;right:12%;padding:10px 12px;column-gap:8px;}
  .seat.me .seat-autopilot-robot{font-size:29px;}
  .seat.me .seat-autopilot-lazy{font-size:27px;}
  @container (max-width:130px){
    .seat-autopilot-badge{left:10%;right:10%;padding:5px 6px;column-gap:3px;}
    .seat-autopilot-robot{font-size:17px;}
    .seat-autopilot-lazy{font-size:14px;}
  }
  @container (max-width:105px){
    .seat-autopilot-badge{top:30%;left:7%;right:7%;padding:4px;column-gap:2px;}
    .seat-autopilot-robot{font-size:14px;}
    .seat-autopilot-lazy{font-size:12px;}
  }
  /* 装备条(第5次微调:去掉不透明白底,改成白色文字直接叠在立绘下半部;
     第6次微调:4行放大到"撑满"阴影区;
     **第7次微调:撑满这个目标本身被取消——字号缩回到和标题栏/武将名/血量协调的比例,
     行距收紧,不再追求"填满阴影区60%"这个目标**(那是第6次微调的目标,这次主动放弃)。
     **同时把"手牌数量图标"塞进装备条区域最左侧,装备文字整体挪到图标右侧、同一横向
     区域内(不是叠在图标上方)**——新增 .seat-equip-row 作为水平flex容器,左边放
     .seat-hand-icon(固定尺寸的图标,不随行数变化),右边放 .seat-equip-bar(仍然是
     4行纵向堆叠的文字列),两者左右并排、垂直居中对齐。
     **字号继续用 cqw 但套 clamp() 夹住上下限**,不是像第6次微调那样让它随卡片宽度
     无限放大——纯 cqw 在"我"的宽卡片(220~260px)上会算出明显大于标题栏(11px)的
     字号,反而不"协调";用 clamp(7px, 6.5cqw, 10px) 夹住:最小卡片(SE 7人局对手,
     96.5px)算出约6.3px会被夹到7px下限,最大卡片("我")算出约14~17px会被夹到10px
     上限,中等宽度的卡片按6.5cqw连续插值——小卡不至于挤成一团难以辨认,大卡也不会
     喧宾夺主盖过标题栏。
     **对比度仍然由 .seat-scrim-bottom 保证,但这次那层渐变改成了半透明(见其注释和
     CLAUDE.md 第7次微调条目的实测数据)**——这是这次改动里风险最高的一环,字号变小
     叠加背景变透明,两个因素都会削弱对比度,所以实测格外重要。 */
  .seat-equip-row{display:flex;align-items:center;gap:4px;padding:0 3px 3px;}
  /* 手牌数量图标:两张交叉叠放的浅色卡牌轮廓(一张左倾一张右倾)+ 黑色描边白字的数字,
     叠在两张卡牌交叉的中间位置。**数字用 text-shadow 描边,不是圆圈/方框底色**——
     这是用户明确要求的视觉效果(和 .corner 角标"纯文字+描边"是同一手法,黑色描边在
     任意背景明暗下都能提供足够对比度,不需要额外的底色块)。
     尺寸同样用 clamp() 夹住随卡片宽度的缩放范围,和装备文字的字号缩放同一个道理。 */
  .seat-hand-icon{
    position:relative;flex:none;
    width:clamp(16px,11cqw,22px);height:clamp(20px,14cqw,27px);
  }
  .seat-hand-icon .hi-card{
    position:absolute;width:60%;height:78%;
    background:var(--paper);border:1px solid rgba(0,0,0,.4);border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  /* 两张卡片**不能共用同一个中心点**——第一版让 a/b 两个矩形位置完全重合、只靠旋转
     角度相反区分,实测(getBoundingClientRect)两者的包围盒是完全相同的数值,截图上看
     就是糊成一个圆角方块,完全看不出"两张交叉的卡牌"这个设计意图。改成左右各自偏移
     一点再反向旋转,两张矩形中心点不同、只有中间一部分重叠,才能真正显出交叉的牌型。 */
  .seat-hand-icon .hi-card.a{left:2%;top:16%;transform:rotate(-18deg);}
  .seat-hand-icon .hi-card.b{left:38%;top:16%;transform:rotate(18deg);}
  .seat-hand-icon .hi-count{
    position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:clamp(9px,7.5cqw,13px);
    text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 0 2px #000, 0 0 2px #000;
  }
  .seat-equip-bar{
    background:none;color:var(--paper);flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:1px;
    font-size:clamp(7px,6.5cqw,10px);line-height:1.15;
    text-shadow:0 1px 2px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.85);
  }
  .seat-equip-bar .erow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:var(--paper);}
  /* 内容密度分支(desktop-layout-8p 第5步):装备名文字本来就一直在渲染,窄屏靠上面这条
     nowrap+ellipsis 截断长名字("雌雄双股剑"/"青龙偃月刀"这类)。宽屏下 render.js 的
     renderSeatCard 会读 isDesktopLayout()(不新增 @media 断点重复判断同一件事)给这一行
     多加一个 wide-name class——这里只是纯 class 选择器(不带 @media),取消截断、允许
     完整装备名换行显示,不撑破卡片(卡片本身 overflow:hidden,换行多出的高度会被这一层
     裁掉而不是把布局撑破,已用真实浏览器截图验证过多件装备同时存在时不溢出/不重叠)。 */
  .seat-equip-bar .erow.wide-name{white-space:normal;overflow:visible;text-overflow:clip;
    overflow-wrap:anywhere;}
  .seat-equip-bar .erow b{color:var(--gold);font-weight:700;margin-right:.15em;} /* 类别首字:金色,和装备名区分;margin用em随字号缩放 */
  .seat-equip-bar .erow .efd{margin-right:.2em;} /* 花色点数:颜色由 render.js 的 seatEquipFace 按红/黑分别给 */
  .seat-equip-bar .erow.filled{cursor:pointer;}
  .seat-equip-bar .erow.empty-slot{color:var(--paper-dim);opacity:.75;} /* 空槽:淡化,但仍在深色渐变上,依然清晰 */
  /* 卡片底部区(判定区 + 装备条):**整块从底部往上堆叠的 flex column**。
     判定区必须显示在装备条"上方"(不能被不透明白底压住看不见),而装备条的高度取决于
     行数(对手1~4行不等、"我"固定4行)——如果给判定区写一个绝对定位的 bottom 偏移量,
     就得凭空猜一个"装备条大概多高"的魔数,行数一变就错位。这里改用"底部锚定的 flex
     column"把两者装在同一个容器里:装备条在下、判定区在上,判定区自然被装备条顶上去,
     不需要任何魔数、也不需要 :has() 或 JS 参与,行数怎么变都不会错位。 */
  /* right 从 0 收进 22px——专门给右下角的出牌顺序编号角标(.seat-order-badge)让出空间,
     不是覆盖它。.seat-bottom 内部所有行(装备/判定区/不屈牌)统一整体收窄,不管哪一行
     恰好落在最底下都不会撞上角标(比按内容类型分别处理更简单,也不用管哪一行是"最后
     一行"这种会随内容变化的判断)。这个 22px = 角标 base 尺寸16px + right偏移4px + 2px
     间隙,和下面各响应式断点里 .seat-order-badge 的尺寸一一对应,改其中一个记得改另一个。 */
  .seat-bottom{position:absolute;left:0;right:22px;bottom:0;display:flex;flex-direction:column;}
  /* ===== 右下角:出牌顺序编号(从 g.turn 开始按真实轮转顺序编号1,2,3...,死亡玩家不
     参与编号、不显示)。常驻显示,不是hover/点击才出现。
     **位置冲突排查**(任务要求先确认、不能直接覆盖已有元素):.seat-bottom(判定区+
     装备行)是 left:0;right:0;bottom:0 铺满整个底部宽度的绝对定位容器,其中
     .seat-buqu-row/.seat-delays 都是 justify-content:flex-end(贴右对齐),装备文字
     (.seat-equip-bar)也可能延伸到接近右边缘——也就是说右下角这块区域本来就被
     .seat-bottom 的动态内容实际占用着。**解决方式:上面把 .seat-bottom 的 right 从 0
     收进 22px,专门腾出这一条给角标**(错开摆放,不是压在谁上面),而不是让角标和装备/
     判定区/不屈牌抢同一块空间。
     视觉复用 .info-badge 已验证过的不透明底衬(#1a1410,不透明十六进制,不受背后立绘
     明暗影响)+ --paper 文字——真实WCAG计算过这组颜色对比度14.04,远超AA的4.5,不新造
     配色,和势力标识/不屈牌一贯"不透明底衬"的既有原则一致。尺寸/位置仿 .seat-identity
     (同样是小方块单字符角标),只是挪到右下角、换一套配色区分"这是顺序"而不是"这是身份"。 */
  .seat-order-badge{
    position:absolute; right:4px; bottom:4px;
    width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;line-height:1;
    border-radius:3px;
    background:#1a1410;color:var(--paper);
    z-index:2;
  }
  .seat.me .seat-order-badge{right:6px;bottom:6px;width:22px;height:22px;font-size:13px;}
  .seat.me .seat-bottom{right:30px;} /* 6(right偏移)+22(me尺寸)+2(间隙) */
  /* 周泰【不屈】不屈牌行:红色系 chip,**不透明底衬**(#4a1414,深红,不透明)——刻意不抄
     .dchip/.seat-huashen-line 那套"半透明+text-shadow"的旧写法,而是走势力标识/装备条那次
     确立的"对比度不随立绘明暗漂移"标准。只显示花色+点数(render.js的seatEquipFace,和装备条
     同一套红/黑配色:红花色#ff6a4d、黑花色var(--paper)),真实WCAG计算过这两个颜色在这个
     不透明红底上同样达标(红花色5.30、白字11.54,均超过AA的4.5)——不新造配色,复用全项目
     "红花色统一用这一个色值"的既有约定。这些牌是规则判定依赖的公开信息(周泰的存活判定是
     "所有不屈牌点数唯一才能不死",其他玩家必须看到才能参与博弈),不做视角限制。位置在
     化身行和判定区之间(数据优先级高于普通判定区,更靠上更显眼)。 */
  .seat-buqu-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;
    padding:0 3px 2px;}
  .seat-buqu-row .bchip{font-size:9px;padding:1px 4px;border:1px solid var(--cinnabar-bright);
    border-radius:4px;background:#4a1414;white-space:nowrap;}
  .seat.me .seat-buqu-row .bchip{font-size:11px;padding:2px 6px;}
  /* 判定区(延时锦囊):叠在图片上层,自带半透明深色底衬(同血量思路,不能只靠描边)。
     紫色系呼应手牌 .card.trick 的锦囊配色,和装备的白底金字区分开。 */
  .seat-delays{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;
    padding:0 3px 2px;}
  .seat-delays .dchip{font-size:8px;padding:0 3px;border:1px solid #7a5fa0;border-radius:4px;
    color:#e2d6f5;background:rgba(40,25,60,.75);white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.9);}
  /* 左慈【化身】声明后的"化身：XX·YY"提示行:和 .seat-delays 的紫色系(锦囊)、
     .seat-equip-bar 的金色系(装备)区分开,用青色系代表"借用的技能"这个新概念。
     字号跟 .seat-equip-bar 同一套 clamp(cqw) 写法(按卡片自身宽度缩放,不需要额外的
     @container 断点),自带不透明底衬(和 .dchip 同一原则,不依赖 .seat-scrim-bottom
     的半透明渐变——那条渐变本身已经够用,这里多一层自己的底色只是让这一行在装备/判定区
     之间更醒目、层次分明,不是必须)。整行可点击(cursor:pointer,呼应装备行/判定区chip
     同样整行可点的既有交互),行内的"?"字符只是视觉提示,不是独立的可点击热区。 */
  .seat-huashen-line{font-size:clamp(7px,6.5cqw,10px);padding:1px 4px;margin:0 3px 1px;
    border:1px solid #3a8ba0;border-radius:4px;color:#bfe8f0;background:rgba(15,45,55,.75);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    text-shadow:0 1px 2px rgba(0,0,0,.9);}
  .seat-huashen-line .huashen-info-mark{font-weight:700;color:#8fd6e6;}
  .seat.me .seat-huashen-line{font-size:10px;padding:2px 5px;}
  /* (第4次微调:原来这里有一条 .seat-title .info-badge 的尺寸规则,"?"已经从标题栏
     挪到右上角、身份方块下方,改由上面的 .seat-info-badge 负责尺寸和定位,这条已删除,
     不再保留一条永远命中不到的死规则。) */
  /* "我"的座位卡:更大、朱红高亮(区别于普通对手卡片)——布局结构完全一致(立绘铺满+
     文字叠加),只是尺寸和边框颜色不同。装备条显示全部4槽(含空槽),所以比对手的更高。 */
  .seat.me{
    border-color:var(--cinnabar);box-shadow:0 0 0 2px var(--cinnabar) inset;
    /* 220px 明确大于对手卡片的 max-width:200px 上限——之前用180px时,如果只有1个对手,
       flex:1的对手会被撑到200px上限,反而比"我"的180px更宽,和"更大、更醒目"的设计意图
       矛盾(Playwright实测抓到的真实问题,不是凭空多虑)。这里改成220px,保证任何对手数量
       下"我"的座位卡都严格大于单张对手卡片。 */
    flex:none;width:220px;max-width:260px;
  }
  .seat.me .seat-title{font-size:13px;padding:5px 8px;}
  /* "我"的卡更大,左侧一列和右上这一套占位/"?"跟着放大、并按更高的标题栏往下让位。
     (.seat-left 是 flex 列,里面各项不再需要各自的 top/left,只调尺寸即可。) */
  .seat.me .seat-left{top:28px;left:6px;gap:3px;}
  .seat.me .seat-faction{width:18px;height:18px;font-size:13px;}
  .seat.me .seat-gen-name{font-size:13px;}
  .seat.me .seat-identity{top:28px;right:6px;width:22px;height:22px;}
  .seat.me .seat-info-badge{top:54px;right:6px;width:18px;height:18px;font-size:11px;}
  .seat.me .seat-hp-col{font-size:14px;padding:4px 3px;} /* left 已由 .seat-left 统一管,这里只调尺寸 */
  /* (第6次微调:原来这里有一条 .seat.me .seat-equip-bar{font-size:10px;...} 的固定像素覆盖,
     已删除——装备条改用 cqw 之后,"我"的卡片本来就比对手宽,同一条基础规则在更宽的容器下
     自然算出更大的字号,不需要再为"我"单独写一份放大版,那样反而会在两条规则之间制造
     "谁该覆盖谁"的隐患。) */
  .seat.me .seat-delays .dchip{font-size:10px;padding:1px 5px;}
  .seat .tag{font-size:9px;letter-spacing:.08em;background:rgba(51,43,36,.85);color:var(--paper);
    border-radius:4px;padding:0 4px;text-shadow:none;}
  .seat .tag.turn{background:var(--gold);color:#1a1410;}
  /* ===== 按"卡片自身宽度"分档(@container),不是按视口宽度(@media) =====
     **卡片内叠加元素的尺寸必须跟着"卡片有多大"走,不能跟着"视口有多宽"走。** 这是被
     测试真实抓到的:座位卡的宽度主要由**对手人数**决定——6 个对手时,即使视口是 667px 的
     SE 横屏,每张卡也只有 96.5×128.66;而 @media 断点只看视口宽度,667px 根本够不到
     640px 那一档,于是小卡片上套用的是**桌面档**的字号,左侧一列(势力占位 + 4字武将名
     竖排 + 4颗心的血量胶囊)累计高度 122.6px > 卡片可用高度,直接溢出到卡外。
     用 @container 按卡片自身宽度分档才对:同样一张 96px 的卡,不管它是因为"7人局"还是
     "窄视口"而变小的,都会拿到同一套收紧后的尺寸。

     **这一段必须放在上面那些 .seat-* 基础规则之后。** @container 本身不增加 specificity,
     和基础规则同为 (0,1,0);同优先级下源码顺序在后的赢。第一版把它写在了基础规则之前,
     结果 font-size 一直被后面的基础规则盖回 11px、分档完全不生效(实测 hp-col 仍是 11px)
     ——和本文件里 .info-badge 那个坑是同一类问题,这里再次踩到。 */
  @container (max-width:150px){
    .seat-left{top:17px;gap:1px;}
    .seat-faction{width:11px;height:11px;font-size:8px;}
    .seat-gen-name{font-size:9px;letter-spacing:0;}
    .seat-hp-col{font-size:9px;padding:2px;}
    .seat-identity{top:17px;width:13px;height:13px;}
    .seat .seat-info-badge{top:32px;width:12px;height:12px;font-size:8px;}
    .seat-order-badge{width:13px;height:13px;font-size:8px;}
    .seat-bottom{right:19px;} /* 4+13+2 */
  }
  @container (max-width:115px){
    .seat-left{top:15px;gap:0;}
    .seat-faction{width:9px;height:9px;font-size:7px;}
    .seat-gen-name{font-size:8px;letter-spacing:0;}
    .seat-hp-col{font-size:8px;padding:1px 2px;}
    .seat-identity{top:15px;width:11px;height:11px;}
    .seat .seat-info-badge{top:27px;width:11px;height:11px;font-size:7px;}
    .seat-order-badge{width:11px;height:11px;font-size:7px;}
    .seat-bottom{right:17px;} /* 4+11+2 */
  }
  /* 横屏矮视口(见下方 max-height:460px 断点)把座位卡尺寸驱动方向反转成"按高度算宽度"
     之后,7人局在 SE 这类矮视口下能算出比这之前任何"按宽度分档"场景都窄的卡(实测约
     70px 宽、94px 高)——比上面 115px 这一档设计时参照的最坏情况(96.5px 宽)还要窄。
     115px 那档的尺寸不够收,叠加内容(势力+4字武将名竖排+血量胶囊)总高度会比卡高多出
     几像素、顶出卡片底部(真实测出的回归,不是猜的)。新增这一档专门收更紧,不修改上面
     115px 那档(它仍然服务于"按宽度分档"的老场景,数值不变)。 */
  @container (max-width:85px){
    .seat-left{top:11px;gap:0;}
    .seat-faction{width:8px;height:8px;font-size:6px;}
    .seat-gen-name{font-size:7px;letter-spacing:-.5px;}
    .seat-hp-col{font-size:7px;padding:1px 1px;}
    .seat-identity{top:11px;width:10px;height:10px;}
    .seat .seat-info-badge{top:22px;width:10px;height:10px;font-size:6px;}
    .seat-order-badge{width:10px;height:10px;font-size:6px;}
    .seat-bottom{right:16px;} /* 4+10+2 */
  }
  /* 三选一选将阶段:候选卡片纵向堆叠,继续用 .avatar-box/.avatar/.avatar-placeholder
     这套独立于座位卡片的头像展示(侧边固定宽度+信息在旁边),和上面 .seat-art
     (铺满整卡+文字叠加)刻意不共用——选将卡片不需要文字叠图片那一整套遮罩/底衬,
     合并只会把两边都搞复杂,分开定义更安全。 */
  .avatar-box{position:relative;flex:none;width:90px;height:120px;overflow:hidden;
    border-radius:8px;background:#15120f;}
  .avatar-box .avatar{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:6px;font-size:11px;color:var(--paper-dim);background:#241f1b;}
  .general-pick-list{display:flex;flex-direction:column;gap:10px;width:100%;}
  .general-pick-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer;
    background:#1d1916;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    transition:border-color .15s ease, background .15s ease;}
  .general-pick-card:hover{border-color:var(--gold);background:#241f1b;}
  .general-pick-info{flex:1;min-width:0;}
  .general-pick-name{font-size:15px;font-weight:700;margin-bottom:4px;}
  .general-pick-desc{font-size:13px;color:var(--paper-dim);line-height:1.6;}
  .pick-progress{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:6px;}
  .pick-progress-row{padding:2px 0;}

  /* ===== 信息条——骨架级重建阶段3 =====
     旧版 .panel.table 沿用的是和大厅表单一样的"圆角卡片"外观(渐变背景+14px圆角+16px内
     边距+14px下外边距),视觉语言和这次新增的 .opp-row/.table-strip/.seat 这套"扁平暗色
     横条"完全不搭,在横屏布局里也偏占空间。这次把它从"卡片"改造成和 .table-strip 同一
     视觉家族的扁平横条——**只覆盖 `.panel.table` 这一个组合选择器，不改通用的 `.panel`
     规则本身**（`.panel` 还被大厅的加入房间表单、配置警告框等复用，动它会有连带风险；
     `.panel.table` 是既有的、只命中这一处的组合选择器，改这里不影响其它 `.panel`）。

     里面的 DOM 结构完全没变（phase-pill/deckInfo/banner/controls/logPanel 五个子元素,
     render.js/render-controls.js 对它们的 innerHTML/textContent 赋值一行没碰）——纯靠
     flex 布局重新排列：phase-pill 和 deckInfo 天然排在最前面,用 flex-wrap 的行内布局
     让它们挤在同一行左右分布；banner/controls/log-panel 各自用 flex-basis:100% 强制
     换到自己的整行（这是它们作为纯文本/按钮组内容本来就需要的全宽展示，不适合和别的
     元素挤在一行），效果上仍是"一行(状态徽标)+若干整行(banner/按钮/日志)"的纵向堆叠，
     只是不再套一层"卡片"外壳、間距更紧凑，更贴近横屏下"信息条"的观感。 */
  .panel.table{
    display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;
    background:rgba(20,15,10,.4);
    border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:0;padding:8px 12px;margin:0 0 8px;
  }
  .phase-pill{
    display:inline-block;border:1px solid var(--gold);color:var(--gold);
    border-radius:999px;padding:4px 14px;font-size:13px;letter-spacing:.18em;
  }
  .deckinfo{font-size:12px;color:var(--paper-dim);}
  #banner{flex-basis:100%;}
  .banner{
    background:rgba(177,54,30,.16);border:1px solid var(--cinnabar);border-radius:10px;
    padding:10px 12px;margin:4px 0 0;font-size:14px;
  }
  /* AI机器人接入第二阶段:"🤖 AI思考中…"提示——只在等待callAI网络响应期间短暂出现,
     由 bot.js 的 showAiThinkingIndicator/hideAiThinkingIndicator 手动切换(不经过
     render(g),AI等待期间不发生任何游戏状态变化,常规渲染周期没有机会托管它的显隐)。
     不设 flex-basis:100%——#banner(紧挨在它前面)自己已经占满一整行,浏览器天然会把
     这个元素挤到下一行开头,不需要它自己也强制整行,这样它只占内容本身需要的宽度,
     不会在没有.banner内容时留下一整条空行。pointer-events:none,和 .my-turn-banner
     同一约定,纯提示、不拦截下方 #controls 里任何按钮的点击。 */
  #aiThinkingIndicator{
    display:inline-block;margin:4px 0 0;padding:5px 12px;font-size:13px;
    color:var(--gold);background:rgba(176,141,79,.1);border:1px solid var(--gold);
    border-radius:999px;pointer-events:none;
  }
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;flex-basis:100%;margin-top:2px;}
  /* 左慈【化身】选技能环节(renderHuashenTwoStepPick):每个候选武将的按钮配一段完整
     desc说明。.huashen-candidate 是"按钮+说明"的小容器,自己走 flex-direction:column
     (按钮在上、说明在下),宽度限制在合理范围内避免整段desc撑成一长条——#controls本身
     是flex-wrap的行,每个candidate容器是其中一个换行单元,和其它按钮混排也不冲突。
     配色/字号复用三选一候选卡片(.general-pick-desc)已经验证过的暗淡小字风格,不新造
     一套视觉语言。 */
  .huashen-candidate{display:flex;flex-direction:column;align-items:stretch;gap:4px;
    max-width:260px;}
  .huashen-candidate-desc{font-size:12px;color:var(--paper-dim);line-height:1.5;
    text-align:left;}

  /* 底部一整行:自己的座位卡(左)+手牌(右)——对应参考图"左下角自己座位卡+底部手牌行"。
     阶段1只做最基础的横排,skill按钮("豹头"样式的武将说明入口)等细节留给阶段3处理。 */
  .bottom-row{display:flex;gap:12px;align-items:flex-start;}
  /* hand */
  .hand-label{font-size:12px;letter-spacing:.14em;color:var(--paper-dim);margin:14px 0 8px;}
  .hand{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:0;}
  .card{
    width:78px;height:112px;border-radius:10px;background:#f1ead9;color:#1a1410;
    border:1px solid #00000022;position:relative;cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s;user-select:none;
    --badge:20px; /* 角标(.corner)/问号图标(.info-badge-hit)的统一基准尺寸,以后想
      整体调大调小只改这一处;响应式断点只需要覆盖这一个变量,不用再分别调整多处硬编码
      尺寸(见 CLAUDE.md)。 */
  }
  /* 手牌悬停放大预览(参考炉石传说手牌交互,纯桌面端效果——触屏设备没有hover这个交互
     状态,手机端天然不会触发,不是bug,不需要额外处理)。.card 这个 class 同时被判定区之外
     的场景复用(如郭嘉【遗计】看牌分配弹窗,render.js 里 createElement 直接生成 .card),
     那些场景不适合放大预览,所以只在手牌容器 .hand 内的 .card 上生效,不写成全局 .card:hover。
     transform-origin:bottom center——从底部中心往上放大,而不是整体居中放大,这样卡片
     左右两侧不会因为放大而把相邻手牌顶开位置;z-index 提升到最高,保证放大后盖在
     其它手牌上方而不是被压在下面。
     真机踩过一个坑:iOS Safari 会用"触摸模拟:hover状态"(第一次点触发hover效果,第二次点
     才真正触发click)让不支持hover的触屏设备也能"看到"CSS里写的hover效果——这套效果本来
     就没打算给手机用,结果被意外触发,连带两个问题:①手机上点一张牌变成要点两次才能真正
     打出(第一次点击被hover动画"消耗"掉了,这是此前一直存在但没被明确报告过的隐藏可用性
     问题,根因和下面这条是同一个);②项目里每次游戏状态更新会把整排手牌DOM销毁重建(含
     图片重新加载),放大+阴影动画叠加高频重绘,在iOS上开销叠加导致明显卡顿甚至卡死。
     修复:改用 @media (hover:hover) and (pointer:fine) 限定——hover:hover 要求设备真的
     支持悬停交互,pointer:fine 要求是精确指点设备(鼠标),两者一起用比单独查hover:hover更
     严格,即使某些触屏设备的浏览器错误报告hover:hover也会被pointer:coarse挡住,触屏设备
     完全不会解析到这段规则,自然也不会被"模拟hover"误触发。box-shadow的transition也一并
     移进媒体查询内部,只在真正会用到悬停放大效果的设备上才声明这段动画(基础.card规则只
     保留transform的transition,不支持hover的设备不需要解析这段无用声明)。 */
  .hand .card{ transition:transform .15s ease; transform-origin:bottom center; }
  @media (hover: hover) and (pointer: fine){
    .hand .card:hover{
      transform:translateY(-30px) scale(2.2);
      z-index:50;
      box-shadow:0 12px 24px rgba(0,0,0,.5);
      transition:transform .15s ease, box-shadow .15s ease;
    }
  }
  /* 手机端(触屏设备)长按放大预览:和上面桌面端 hover:hover/pointer:fine 是两条独立的
     交互路径——桌面端靠CSS伪类响应真实悬停,这里靠 render.js 的 attachLongPressPreview
     手动长按500ms后切换这个class来触发同一套视觉效果(数值故意和上面.hover规则完全一致,
     保持两种输入方式看到的放大效果一致)。这条规则不写在上面的 @media 里——它本来就只会
     被touch事件手动触发,不依赖hover/pointer媒体特性,写在媒体查询外面才能在触屏设备上
     生效(如果误放进 hover:hover and pointer:fine 里,反而会在触屏设备上被媒体查询整体
     排除,长按功能会完全失效)。 */
  .card.long-press-preview{
    transform:translateY(-30px) scale(2.2);
    z-index:50;
    box-shadow:0 12px 24px rgba(0,0,0,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  /* ===== 卡片分区版式(顶部标题栏+下方插画区域,更接近实体卡牌观感)=====
     曾经是"图片铺满全卡+.big牌名大字靠no-art控制显示/隐藏"这版,现在改成固定分区:
     .card-title 牌名文字始终由代码生成、始终显示,不再依赖有没有图片(见 CLAUDE.md)。
     【字号历史】曾经是CSS写死font-size:14px(短名基准)+按.trick/.steal类别写死字号
     (4字锦囊类专属),后来改成按牌名字数(4/5字)分档用inline style覆盖——这两版都是
     "手动猜大小",覆盖不到所有长度组合。**这次改成 render.js 的 fitFontSize 用canvas
     文字测量实测自适应**,每次渲染都精确算出这张牌的名字刚好能放进可用宽度的字号,
     不再需要在这里写任何字号(inline style 100%覆盖,CSS 不设font-size,详见 render.js
     的 renderHand)。
     padding 给标题栏两侧留安全边距(--badge尺寸的0.12倍,不是完整让开一整个badge宽度,
     只是让文字不贴着最边缘开始、给视觉留白,避免和角标/问号图标贴得太紧;fitFontSize
     算可用宽度时用的也是这个同一个padding公式,两处必须保持一致,否则算出来的字号会
     和实际渲染的可用空间对不上)。
     overflow:hidden+white-space:nowrap 是最后一道防线(不是主要机制)——fitFontSize
     正常工作时不会触发换行/截断,这两条只是防止极端情况(比如canvas测量因为字体加载
     延迟等原因估算有偏差)时不至于破坏布局。**不再需要 text-overflow:ellipsis**:
     既然 fitFontSize 已经确保文字宽度不超过可用空间,理论上不会触发省略号这条路径。 */
  .card-title{
    flex:0 0 22%;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#2b1d14;background:rgba(255,255,255,.34);
    border-bottom:1px solid rgba(0,0,0,.15);
    padding:0 calc(var(--badge) * 0.12); overflow:hidden; white-space:nowrap;
  }
  /* 自己的手牌把花色角标和说明按钮放到插画区顶部，标题栏不再被左右两个图标
     挤得只剩十几像素。这样长牌名可以使用完整卡宽，避免被缩成看不清的小字。 */
  .hand .card-title{padding:0 5px;}
  .hand .card .corner,
  .hand .card .info-badge-hit{top:calc(22% + 3px);}
  .card-art-box{flex:1 1 auto;position:relative;overflow:hidden;}
  .card-art-box .card-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  /* 没图时(映射表缺失、或全部候选格式都加载失败)插画区域留一块占位底色,不完全空白,
     也不会露出浏览器原生的"图裂了"破图标(<img>本身已被 cardImgError display:none)。 */
  .card.no-art .card-art-box{background:rgba(0,0,0,.08);}
  /* 角标定位基准/尺寸/视觉样式几经调整,这是最新版本。
     【定位基准的历史】①最初是 .card 的直接子元素、相对整张卡片定位,但没有顶开标题栏
     高度,top:5px 落在标题栏那一行、和牌名文字视觉重叠;②随后挪进 .card-art-box 内部
     改成相对插画区域定位,避开了标题栏,但视觉上角标位置变成跟着插画区域的尺寸走;
     ③改回 .card 的直接子元素、用 top:calc(22%+5px) 顶开标题栏高度;④角标尺寸收敛到
     --badge 变量并调小到 20px 后,重新采用 top:0;left:0,和 .info-badge-hit(同样
     top:0;right:0)严格对齐在同一条水平线,形成真正的左右对角(见下方"尺寸"小节)。
     只保留左上角一个角标,右下角(.corner.br)已删除——单个角标已经能完整传达花色点数
     信息,不需要两处重复;render.js 的 renderHand 也不再生成 .corner.br 这个 div。
     【尺寸】宽高用 var(--badge),字号用 calc(var(--badge) * 0.42)(按比例跟随角标
     尺寸缩放,不再是独立维护的一个数字)——响应式断点只需要覆盖 .card 的 --badge 这
     一个变量,.corner 和 .info-badge-hit 的尺寸/字号会通过 calc() 公式自动重新算出。
     【视觉样式,历史】曾经是半透明圆形徽章(深色径向渐变底+金色细边);随后改成纯文字
     +text-shadow(黑色双层描边阴影)保证在任意插画背景上可读。
     【这次的改动】进一步去掉 text-shadow,回归最纯粹的纯文字——标题栏字号现在已经
     用 canvas 文字测量实测自适应(见 render.js 的 fitFontSize),不再需要靠阴影去
     补偿"字号算不准导致和插画背景冲突"这类问题;纯文字视觉上最轻量,不额外增加任何
     视觉噪音。**如果以后实测发现某些浅色/高对比度插画背景下角标文字确实难以辨认,
     再重新评估要不要加回一层轻量阴影**——这次没有遇到需要加回的实测证据,不要凭空
     加回去。
     **文字颜色的红黑花色区分不受这次改动影响**:角标内容是 cardFace(card)(data.js)生成的
     `<span style="color:...">`,红桃/方块显示红色数字、黑桃/梅花显示黑色数字,inline style
     的优先级天然高于这里 .corner 的 color(#e8d5a8 只是没有具体花色信息时——理论上不会发生,
     cardFace 总是返回带色 span——的兜底文字色),红黑区分逻辑完全保留、不受这次改动
     影响——这是每张牌实例的真实游戏机制信息(如乐不思蜀判定看花色),不能被图片替代
     或省略。 */
  .corner{
    position:absolute; top:0; left:0; z-index:2;
    min-width:var(--badge); height:var(--badge); padding:0 3px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(12px,calc(var(--badge) * 0.7),15px); font-weight:900;
    color:#1a1410; background:#f1ead9;
    border-right:1px solid rgba(0,0,0,.32); border-bottom:1px solid rgba(0,0,0,.32);
    border-radius:0 0 6px 0;
  }
  .mount-role{position:absolute;right:3px;bottom:3px;z-index:2;width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#f1ead9;color:#6f241d;border:2px solid #6f241d;font-size:15px;font-weight:900;
    box-shadow:0 1px 3px rgba(0,0,0,.55);}
  /* 每种牌型都有和标题文字同色的2px inset描边(+原有2px投影),.sha(杀)不再是唯一带描边
     的牌型——统一视觉风格,五种牌型(杀/桃/闪/普通锦囊/顺手拆桥类)一眼就能通过卡片边框
     颜色分辨类别,不需要盯着标题文字看。 */
  .card.sha{box-shadow:0 0 0 2px var(--cinnabar) inset,0 2px 0 rgba(0,0,0,.3);}
  .card.tao{box-shadow:0 0 0 2px var(--jade) inset,0 2px 0 rgba(0,0,0,.3);}
  .card.tao .card-title{color:#185b43;}
  .card.shan{box-shadow:0 0 0 2px #2f5b86 inset,0 2px 0 rgba(0,0,0,.3);}
  .card.shan .card-title{color:#214f7a;}
  .card.trick{box-shadow:0 0 0 2px #7a5fa0 inset,0 2px 0 rgba(0,0,0,.3);}
  /* 锦囊/顺手类牌名字号不再需要在这里单独处理——render.js 的 fitFontSize 对所有牌名
     一视同仁用canvas实测算出合适字号,不分牌型类别,只保留按牌型区分的文字颜色 +
     letter-spacing(轻微收紧字距,辅助长牌名排布,和字号算法不冲突)。 */
  .card.trick .card-title{color:#513573;letter-spacing:-.02em;}
  .card.steal{box-shadow:0 0 0 2px #1f7a6e inset,0 2px 0 rgba(0,0,0,.3);}
  .card.steal .card-title{color:#135f55;letter-spacing:-.02em;}
  .card.selected{outline:3px solid var(--gold);transform:translateY(-6px);}
  /* 弃牌阶段"多选后统一确认":已勾选待弃置的牌在既有.selected(金色描边+上浮)基础上叠加
     一层半透明朱红遮罩+朱红描边,明确区分"这张要被弃掉"和其它场景下的".selected"(选中
     待使用/待移动等),避免玩家把两种不同含义的"选中态"混淆。 */
  .card.discard-selected{outline-color:var(--cinnabar-bright);box-shadow:inset 0 0 0 999px rgba(216,73,44,.28);}
  /* 不可操作时只禁止点击，牌面继续保持正常颜色；是否轮到自己由操作栏提示，
     不再用发白、灰度或透明度变化破坏牌面辨识度。 */
  .card.disabled{pointer-events:none;cursor:not-allowed;}
  .cardback{
    width:46px;height:66px;border-radius:8px;
    background:repeating-linear-gradient(45deg,#3a302a,#3a302a 6px,#2c241f 6px,#2c241f 12px);
    border:1px solid var(--line);
  }
  .backs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .backs .cardback{width:20px;height:28px;}

  /* ===== 说明浮层 + "?" 触发角标(手机/电脑通用;查看说明与出牌手势分离,靠 stopPropagation) =====
     这几条基础规则必须放在下面两个 @media 断点之前——同选择器同优先级时 CSS 靠源码顺序决胜负,
     之前误把它们放在断点后面,导致断点里对 .info-badge/.card .info-badge-hit 的所有覆盖全部
     被这里的"无条件"规则重新盖掉,不管断点里写什么尺寸,实际生效的永远是这里的桌面尺寸——
     这是"改了尺寸手机上却看不出变化"的真正原因之一,必须挪到断点之前才能让断点覆盖生效。 */
  .info-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:700;line-height:1;cursor:pointer;
    background:#1a1410;user-select:none;flex:0 0 auto;}
  /* 手牌卡片上的角标:外层 .info-badge-hit 是绝对定位的实际点击热区(比视觉圆圈大,手指好点中),
     内层 .info-badge 只管视觉圆圈大小——两者分离,断点缩小的是视觉尺寸,不牵连点击热区。
     定位在右上角:左上=花色点数(.corner),右上本身是空的,唯一要注意的是——卡片只有
     46~64px 宽,热区盒子如果还按"越大越好点"做到 32~34px,盒子本身就会顶到卡片将近一半,
     把居中于热区内的视觉圆圈推离真正的右上角、往卡片中线靠,和左上角花色点数重新撞上
     (这正是上一版放右上角失败的原因,不是"位置本身不行",是"热区盒子相对卡片太大,把圆圈
     挤离了角落")。这次视觉圆圈已经缩得很小,热区盒子跟着按各断点等比例收紧、贴着真正的
     右上角,不再让圆圈被推向中间——已用真实渲染测量确认(见 CLAUDE.md)三档宽度下都不重叠。
     热区盒子和 .corner 共用同一个 --badge 尺寸变量(声明在 .card 上):两者本来就该是
     严格对称的左右对角,共用一个变量后不可能出现"一个改了另一个忘了改"这种不对称——
     内层视觉圆圈比热区盒子小 8px(和原来 26px 热区配 18px 圆圈同一个比例关系),字号
     按 --badge 的比例算,不再是独立维护的数字。 */
  .card .info-badge-hit{position:absolute;top:0;right:0;width:var(--badge);height:var(--badge);display:flex;
    align-items:center;justify-content:center;pointer-events:auto;z-index:3;cursor:pointer;}
  .card .info-badge-hit .info-badge{width:calc(var(--badge) - 8px);height:calc(var(--badge) - 8px);font-size:calc(var(--badge) * 0.35);}

  /* ===== "轮到你了"大字提示:语音提示(可能被浏览器自动播放策略拦截而静默失败)的视觉兜底,
     即使听不到声音也能看到。刻意不复用 .banner——.banner 是常驻的"当前该谁做什么"提示条,
     被决斗/技能询问等很多场景复用,改大会影响那些场景;这是独立的、短暂出现自动消失的
     大字覆层,只用于"轮到我了"这一个场景,视觉上比 logToast 更醒目(更大字号、居中、
     短暂遮罩),复用同一套"class 加/减触发 CSS 动画"的实现模式。
     pointer-events:none 全程生效,不会挡住玩家点击下面的操作按钮,哪怕提示还没消失。 */
  .my-turn-banner{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
    font-size:2.2rem; font-weight:700; color:var(--cinnabar-bright);
    background:rgba(20,16,12,0.92); padding:28px 48px; border-radius:16px;
    border:2px solid var(--cinnabar); z-index:9999;
    opacity:0; pointer-events:none; text-align:center;
    transition:opacity .25s ease, transform .25s ease;
  }
  .my-turn-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  @media (max-width:640px){
    .my-turn-banner{font-size:1.6rem;padding:20px 34px;}
  }
  @media (max-width:480px){
    .my-turn-banner{font-size:1.3rem;padding:16px 26px;}
  }

  /* ===== 窄宽度断点(座位卡宽度靠 flex:1 1 0 天然响应式、高度靠 aspect-ratio:3/4 自动
     跟随宽度,都不需要按断点写死;但卡片内部叠加的文字元素是固定字号,不会跟着卡片缩放,
     所以这两个断点要把它们逐档收紧,否则窄屏下文字会相对卡片显得过大、把立绘盖住太多)。
     这次改动面向横屏为主,这两个断点更多是"万一在很窄的窗口下查看"的兜底,不是主要设计
     目标(横屏下常见宽度远宽于640/480这两个值,iPhone SE横屏667px这个已验证过的最紧张
     场景本身就在这两个断点范围之外)。 ===== */
  @media (max-width:640px){
    /* 手牌:桌面 64x92 在窄屏上占太多行;缩小卡面本身,flex-wrap(已有,见 .hand)继续兜底
       "无论多少张手牌都不会横向溢出/需要横向滚动"这条硬指标——缩小是为了减少换行数量,
       不是靠它来防溢出(防溢出这件事从一开始就是 flex-wrap 的职责,缩小前后都不会溢出)。 */
    .hand{gap:6px;}
    .card{width:58px;height:84px;--badge:15px;} /* 角标/问号图标统一收窄,.corner
      和 .info-badge-hit 的尺寸/字号靠 calc() 公式自动跟着算,不用再分别写死两套数值。
      .card-title 的字号也不需要在这里覆盖——fitFontSize(render.js)按这一档实际
      的卡片宽度/--badge值实测计算,inline style 100%覆盖,这里写CSS字号也不会生效。 */
    .table-strip{min-height:52px;padding:3px 6px;}
    .table-card-who{font-size:11px;}
    .table-card-name{font-size:17px;}
    .table-card-face{font-size:14px;}
    .seat-title{font-size:10px;padding:2px 4px;}
    /* 左侧一列(.seat-left,里面是势力占位/武将名/血量)和右上(身份方块/"?")在窄屏
       同步收紧,并按更矮的标题栏往上收。列内各项不再需要各自的 top(flex 列自动排),
       只调整列的起点和各项尺寸。
       "?"的选择器同样要带 .seat 前缀提高优先级,否则会被靠后的通用 .info-badge 基础
       规则(22px)按源码顺序盖掉(见上面 .seat .seat-info-badge 的说明)。 */
    .seat-left{top:17px;}
    .seat-faction{width:12px;height:12px;font-size:9px;}
    .seat-gen-name{font-size:10px;}
    .seat-identity{top:17px;width:13px;height:13px;}
    .seat .seat-info-badge{top:33px;width:12px;height:12px;font-size:8px;}
    .seat-order-badge{width:13px;height:13px;font-size:8px;}
    .seat-bottom{right:19px;} /* 4+13+2,和 @container(max-width:150px) 那档同一组数值 */
    .seat-hp-col{font-size:10px;}
    /* (第6次微调:原来这里有一条 .seat-equip-bar{font-size:7px;padding:2px} 的固定像素覆盖,
       已删除——这是视口宽度断点,和卡片自身宽度(由对手人数决定)不是一回事,continuing to
       override 会在≤640px的视口上把 cqw 算出来的字号强行按回7px,悄悄废掉这次放大的效果
       (CLAUDE.md 里已经记过好几次这类"断点覆盖了不该覆盖的规则"的坑,这是同一类问题,
       这次改CSS前就先排查掉了,不是留到出bug才发现)。) */
  }
  @media (max-width:480px){
    .card{width:52px;height:76px;--badge:14px;} /* 再收紧一档,.corner/.info-badge-hit
      跟着 --badge 自动缩小,不用逐处对齐;.card-title 字号同上由 fitFontSize 实测,
      这里不需要再覆盖。 */
    .table-strip{min-height:44px;padding:2px 4px;}
    .table-card-who{font-size:10px;}
    .table-card-name{font-size:14px;}
    .table-card-face{font-size:12px;}
    .seat-title{font-size:9px;}
    .seat-left{top:15px;}
    .seat-faction{width:11px;height:11px;font-size:8px;}
    .seat-gen-name{font-size:9px;}
    .seat-identity{top:15px;width:12px;height:12px;}
    .seat .seat-info-badge{top:29px;width:11px;height:11px;font-size:7px;}
    .seat-order-badge{width:11px;height:11px;font-size:7px;}
    .seat-bottom{right:17px;} /* 4+11+2,和 @container(max-width:115px) 那档同一组数值 */
    .seat-hp-col{font-size:9px;}
    /* (第6次微调:同上一个断点,原有的 .seat-equip-bar{font-size:7px} 固定像素覆盖已删除。) */
  }

  .err{color:var(--cinnabar-bright);font-size:13px;margin-top:8px;}
  .footnote{color:var(--paper-dim);font-size:11px;text-align:center;margin-top:26px;line-height:1.7;}

  /* 圆形图标按钮统一样式(#helpBtn 与 .info-close 共用):固定尺寸的圆 + flex 居中图形,
     覆盖全局 button 的 padding/line-height,避免字形因内边距不对称而偏移错位。 */
  .icon-btn{padding:0;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  #helpBtn{position:fixed;top:12px;right:12px;z-index:50;width:44px;height:44px;
    border:1px solid var(--gold);background:#1a1410;color:var(--gold);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  /* 日志按钮:和 helpBtn 同款固定圆形图标,挨着放(往左让位),点开复用 showInfo/infoModal 浮层——
     日志默认收起,只留这一个入口,和第4步"banner常驻焦点 + 完整历史收进可展开面板"的设计一致。 */
  #logBtn{position:fixed;top:12px;right:64px;z-index:50;width:44px;height:44px;
    border:1px solid var(--gold);background:#1a1410;color:var(--gold);font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  /* 常驻"关闭房间"入口(cleanupRoom):不管游戏处于什么阶段都可见,固定挂在页面角落、不随
     render(g)重绘变化。放左上角(而不是和 #helpBtn/#logBtn 同一个右上角)——避开已有的圆形
     图标按钮堆叠,同时这个按钮本身是"危险操作"入口,和"帮助/日志"这类常规查看类按钮分开
     放置,视觉上不容易被误认成同一组功能、也不容易被手误连续点错。
     【真机踩过的坑】最初做成文字按钮("关闭房间"四个字,自适应宽度),在375px这类窄屏下
     实测(Playwright量bounding box,不是只凭肉眼截图判断)发现文字按钮宽达74px,右边缘
     (x=83.8)确实穿进了标题里"杀"字印章图标(h1 .seal,x从63.15起)的范围,是真实的视觉
     重叠,不是误报。改成和 #helpBtn/#logBtn 同款的44x44圆形图标按钮(用🚪表示"离开/关闭
     房间"这个语义,title属性保留完整文字说明给屏幕阅读器/鼠标悬停提示),右边缘固定在
     x=56,比标题印章图标的起始位置(x=63.15)更靠左,不会有任何重叠——图标按钮的固定尺寸
     比文字按钮的"按内容自适应宽度"更容易通过量出来的具体数值保证不越界。 */
  #closeRoomBtn{position:fixed;top:12px;left:12px;z-index:100;width:44px;height:44px;
    border:1px solid var(--cinnabar-bright);background:#1a1410;color:var(--cinnabar-bright);
    font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  /* 调试日志入口(debugLogBtn):和 #closeRoomBtn 同一列、往下一格(top:64,不是同一行往右挪),
     不是照抄 #logBtn 相对 #helpBtn 的"同一行往左挪64px"那套——h1 标题是 text-align:center,
     视口变窄时标题("杀"印章图标)会向左移动、越靠近页面左上角,如果在 left:12 这一行再加一个
     往右挪的按钮(比如 left:64),窄屏下右边缘64+44=108 这段区域正是标题可能移动到的地方，
     和 CLAUDE.md 记录的 #closeRoomBtn 当年"文字按钮右边缘穿进标题印章"是同一类坑，这次
     刻意换个方向避开(往下而不是往右),不在同一水平带上和标题抢位置。top:64 和 .log-panel
     宽屏覆盖规则里"top:64 避开顶部44px高按钮"用的是同一个数值,两者互不冲突(.log-panel
     在 right 侧,这里在 left 侧)。 */
  #debugLogBtn{position:fixed;top:64px;left:12px;z-index:50;width:44px;height:44px;
    border:1px solid var(--gold);background:#1a1410;color:var(--gold);font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  /* AI托管入口(aiTestBtn):和 #debugLogBtn 同一行、往右一格(debugLogBtn left:12,这里 left:64),
     同款固定圆形图标按钮,复用 #closeRoomBtn/#debugLogBtn 那套定位+尺寸+配色。z-index:50
     与其他图标按钮一致、低于弹窗(#aiTestModal 是 z-index:120),点开弹窗不会压住弹窗交互。 */
  #aiTestBtn{position:fixed;top:64px;left:64px;z-index:50;width:44px;height:44px;
    border:1px solid var(--gold);background:#1a1410;color:var(--gold);font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}

     12——那一格此前空着:top:12 只有 left:12 的 #closeRoomBtn 和右上角的 helpBtn/logBtn)。
     其余定位/尺寸/配色与 #aiTestBtn 逐项一致,同为 z-index:50、低于弹窗的 120。 */
  #aiPanelBtn{position:fixed;top:12px;left:64px;z-index:50;width:44px;height:44px;
    border:1px solid var(--gold);background:#1a1410;color:var(--gold);font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}

  .dbglog-item{border-bottom:1px solid var(--line);padding:8px 0;}

  /* ===== AI托管信息窗(可拖动/可调整大小) ===== */
