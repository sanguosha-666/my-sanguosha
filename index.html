  /* ===== 强制横屏软引导——骨架级重建阶段3 =====
     CSS/浏览器原生的屏幕方向锁定 API(Screen Orientation Lock)支持非常有限(尤其 iOS
     Safari 完全不支持,只有部分 Android 浏览器在"已安装为全屏 PWA"时才生效),这个项目
     是普通网页、不是安装到主屏幕的 PWA,没有条件依赖那套 API 强制锁定。标准做法是软引导:
     检测到当前是竖屏就盖一层全屏遮罩提示手动旋转,不做任何"真正锁死方向"的尝试——转成
     横屏后遮罩自动消失,期间游戏状态/网络连接完全不受影响(遮罩只挡交互,不中断/不重置
     任何东西),这是浏览器环境下唯一可靠、跨机型一致的方案。
     z-index 定得比现有最高的 .my-turn-banner(9999)还高,必须能盖住包括它在内的一切;
     和 .my-turn-banner 刻意 pointer-events:none 不同,这里默认(不设 pointer-events)
     保留可拦截点击的能力——遮罩存在期间就是要挡住底下的交互,这是它的核心职责。
     显示/隐藏的判断逻辑(matchMedia('(orientation: portrait)')+ resize/orientationchange
     监听)在 render.js 里(见 checkLandscapeGate),这里只负责外观。 */
  .landscape-gate{
    position:fixed;inset:0;z-index:10000;
    background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:24px;
  }
  /* 显示/隐藏靠通用的 .hidden{display:none!important} 规则(文件末尾已有),不用再单独
     写 .landscape-gate.hidden——避免同一个开关维护两份重复(甚至可能不一致)的规则。 */
  .landscape-gate-icon{font-size:56px;color:var(--gold);animation:landscapeGateSpin 1.8s ease-in-out infinite;}
  @keyframes landscapeGateSpin{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(90deg);}
  }
  .landscape-gate-text{font-size:18px;color:var(--paper);letter-spacing:.06em;line-height:1.6;}

  /* ===== 手机横屏矮视口:全页面纵向压缩(修真机"一屏装不下"的bug) =====
     **实测数据先于这段CSS存在,不是拍脑袋写的**:用 Playwright 在真实的"宽而矮"横屏
     视口(iPhone SE 667×375 / iPhone 12·13 844×390 / iPhone 16 874×402,注意是宽×高,
     高度是小的那个数)里跑完整布局,量出全页面纵向内容总量约 1163px——是这三档真机
     视口高度的近 3 倍。**关键发现:不是只有座位卡超高**——剔除座位卡这个最大单项开销
     (对手行279px+"我"的卡293px)之后,剩余的固定开销(标题栏91px+中央出牌区64px+
     信息条243px+两行手牌标签36px+页脚提示37px,外加各处margin/padding)仍有约
     700~750px,本身就已经是视口高度的近2倍——这不是"座位卡 aspect-ratio 方向反了"
     这一个局部问题,是**全项目此前没有任何一条 @media (max-height:...) 规则、所有
     断点清一色只按视口宽度分档**这个更根本的缺口(所有此前的验证,包括这次骨架级重建
     反复截图确认过的"iPhone SE横屏667px"那一档,量的都是宽度方向,高度这个维度从
     一开始就没被当作约束条件对待——桌面视口和手机横屏视口在"高度是否吃紧"这件事上
     给出的是同一个从不吃紧的假象;这条教训记进了 CLAUDE.md 规则22)。

     **座位卡尺寸驱动方向反转,是这次压缩里最核心的一步**:base rule(见上面 .seat/
     .seat.me)是"设 width(flex/min/max-width),靠 aspect-ratio 反推 height"——这个
     方向在桌面/横屏宽视口下没问题,但在矮视口下会让 height 完全不受控(宽度按对手
     人数弹性分配多宽,高度就被反推成多高,和视口还剩多少高度毫无关系)。这里反过来:
     显式设 height(用 clamp() 夹住一个和视口高度(dvh)相关的值),width:auto,
     aspect-ratio:3/4 依然保留但求值方向变成"由 height 反推 width"——这是 CSS
     aspect-ratio 规范本身支持的用法(显式设置一个维度、另一维度 auto,会按比例反推
     另一维度),不需要额外 JS 计算逐帧读视口高度。
     **横屏下稀缍的是高度,矮视口里就该让高度当主动变量、宽度当从属变量**——这正是
     base rule 的方向在这个场景下颠倒过来的地方。

     **"座位卡宽度会不会因此变得太窄不可读"这个疑虑,用实测回答,不是拍脑袋接受或
     拒绝**:实测(measure_landscape_heights.js + zoom_opp_card.js 放大截图核对)——
     最终 clamp(70px,25dvh,120px) 这个范围下,SE 横屏(375px高)7人局算出的对手卡宽度
     实测约 70.3px,比此前"按宽度分档"年代定的90px下限更窄,但已用放大截图核对过这个
     宽度下最坏文字组合(颜良文丑+青龙偃月刀)仍清晰可读,可读性下限已相应下调到68px
     (这是设计变化的直接结果,不是回归,详见 CLAUDE.md);2~3人局(对手更少、height
     会顶到 clamp 的120px上限)算出的宽度明显更宽裕,不构成风险。

     **"我"的卡为什么用独立的、比对手更矮的 height 预算,而不是共用同一个 clamp**:
     "我"的卡和 .hand(手牌)在同一个 .bottom-row 里左右并排,这一行的实际高度取
     两者较高的那个——如果"我"的卡沿用桌面语境下"比对手更大更醒目"那个 220px-vs-200px
     的比例、套进height-驱动的clamp里同样按比例放大,会比手牌卡明显高出一截,那部分
     多出来的高度只是被浪费掉(手牌卡不会跟着变高,行高仍然取两者较高值),纯属浪费
     宝贵的纵向预算。这里改成给"我"的卡单独一个更贴近手牌卡实际高度的 clamp,让
     .bottom-row 这一整行的高度不再被"我"的卡单方面撑高——用实测验证过:调整后
     .bottom-row 的高度和"我"的卡高度基本相等(不再比手牌卡高出一大截)。 */
  @media (max-height:460px) and (orientation:landscape){
    .wrap{padding:4px 8px 4px;}
    /* h1/.sub 只在"游戏已经开始"时收紧(用 :has() 判断 #game 是否带 hidden class,
       和大厅遥测里 #game.hidden 的开关是同一个既有机制,不需要新增 JS/新增 class)——
       大厅界面本身不受这次纵向压缩影响,还是原来宽松的标题栏,矮视口下真正紧张的是
       "已经在游戏中"这个场景。 */
    .wrap:has(#game:not(.hidden)) h1{font-size:13px;letter-spacing:.1em;text-indent:.1em;margin:0;}
    .wrap:has(#game:not(.hidden)) .sub{display:none;}
    /* footnote("部署后…"这类大厅提示)对已经在游戏中的人毫无意义,纯粹是死重——用
       CSS 相邻/后继兄弟选择器隐藏(footnote 在 DOM 里排在 #game 之后,可以用
       #game:not(.hidden) ~ .footnote 判断),不需要碰 JS。大厅阶段(#game 带
       hidden)footnote 仍正常显示。 */
    #game:not(.hidden) ~ .footnote{display:none;}

    .opp-row{padding:2px 4px;gap:4px;}
    .seat{
      height:clamp(70px, 25dvh, 120px);
      width:auto;
      aspect-ratio:3/4;
      flex:0 0 auto; min-width:0; max-width:none;
    }
    /* **"我"的卡最初设计成贴近手牌卡高度(约64px),真实测出两个问题,已推翻那版设计**:
       ①64px比对手卡矮,违反"我的卡必须比对手更醒目/更大"这条早就定过、有专门回归测试
       锁定的既有规则(verify_stage1_seatcard.js);②更严重的是,64px这个高度让装备条
       (4行·cqw字号已经卡在7px下限,行数/字号都缩不动了)在 .seat-scrim-bottom 这层
       渐变里的相对位置整个移到了渐变已经变得很淡的区域——实测对比度从正常的12~14骤降到
       2.6~3.2,远低于 WCAG AA 的 4.5(装备条+渐变这套系统是第5~7次微调专门用实测调出来的,
       是针对"卡高112~260px"这个范围校准的,64px大幅跌出了这个范围,不是"再调一下渐变"
       就能补的,是从根源上卡片矮到系统设计的下限之下了)。
       **现在的解法**:给"我"的卡一个和对手同量级、只是略大一点的高度(不再追求贴近
       手牌卡),牺牲掉"贴近手牌卡高度、bottom-row不浪费空间"这个最初的次要目标,换回
       "落在装备条+渐变系统已验证过的安全高度范围内"这个更重要的正确性要求——已重新
       实测确认这个高度下对比度恢复正常(见 debug_scrim_regression.js/verify_seatcard_equipscrim.js/verify_seatcard_round7.js,最低对比度回升到7.45,远高于WCAG AA的4.5)。 */
    .seat.me{
      height:clamp(74px, 26.5dvh, 124px);
      width:auto;
      flex:none; max-width:none;
    }

    .table-strip{min-height:24px;padding:2px 4px;}
    /* #tableStrip 里真正撑起高度的是 .table-card 自己的 min-height:48px(基础规则),
       .table-strip 的 min-height 只是外层包装,不改 .table-card 本身、上面那行
       几乎不生效——这是排查溢出时才发现漏改的一处。 */
    .table-card{min-height:18px;gap:1px;}

    .panel.table{padding:2px 5px;margin:0;gap:1px 6px;}
    .phase-pill{padding:1px 7px;font-size:9px;letter-spacing:.06em;}
    .deckinfo{font-size:8px;}
    .banner{padding:3px 5px;margin:1px 0 0;font-size:10px;line-height:1.25;}
    .controls{gap:4px;margin-top:1px;}
    .controls button{padding:3px 7px;font-size:10px;}
    /* .log-panel(常驻的最近几条日志面板)是排查这次溢出时才发现漏算的一块真实开销
       (68px+间距,几乎占了 .panel.table 剩余高度的一半)——它和上面 #myGeneral 的
       完整描述是同一类"有独立入口能查看完整信息、这里只是常驻的便利副本"的东西
       (点击📜按钮能看完整历史日志),矮视口下空间优先级不如把座位卡/中央出牌区/
       手牌显示完整,这里直接隐藏,不影响任何功能(日志历史依然可查)。 */
    .log-panel{display:none;}

    /* #myGeneral(自己的武将名+技能+完整描述)在正常宽视口下只占一行,但描述文字本身
       长短不一(比如郭嘉天妒+遗计两段说明,是全表最长的一条)——矮视口下宽度也跟着
       变窄,长描述在窄宽度下会换行、吃掉不可预测的纵向空间。完整描述本来就能通过
       座位卡的"?"说明入口(showGeneralInfo)随时查看,这里的内联描述是重复信息,
       这个断点下直接隐藏描述部分(只留"你的武将:XX·技能名"这半句),从根源上
       避免"某个武将描述特别长导致换行、把手牌行挤到视口外"这个不可控风险,不是
       只测了几个短描述的武将就当作验证过了。 */
    .hand-label{font-size:9px;margin:2px 0 1px;}
    #myGeneral span{display:none;}
    .bottom-row{gap:6px;}
    .card{width:44px;height:64px;--badge:12px;}
  }

  /* ===== 宽屏桌面布局(feature/desktop-layout-8p 第3步骨架) =====
     只处理"座位卡+中央出牌区怎么摆",信息条/手牌行这一步只给"各占一整行、按顺序往下排"
     的兜底位置(不重叠即可)——具体怎么排布留给下一步(#4日志面板挪位置/#5内容密度分支)
     专门处理,这里不深究。是否启用这套grid由 render.js 的 isDesktopLayout()/
     updateDesktopLayoutFlag() 双重把关:JS 判断 window.innerWidth>=1024 才会给 #game
     加上 desktop-layout 这个 class,这里的 @media(min-width:1024px) 是第二道保险,
     两边都满足才真正生效(和 checkLandscapeGate() 的软引导一样,JS 判断负责动态响应
     resize,不是只在页面加载那一刻算一次)。
     #game 变成 grid 容器后,它原本的每一个直接子元素都会变成 grid item——为了不改动
     #oppRow/.bottom-row 内部现有的 DOM 结构(座位卡仍然是 #oppRow 的子节点,#meSeat/
     #hand 仍然是 .bottom-row 的子节点,不需要为宽屏布局单独维护一份不同的 DOM 树),
     这两个容器在桌面模式下用 display:contents"打散"成透明壳——它们自己不再生成盒子,
     但子孙节点(.seat[data-zone]/#meSeat/#hand)会直接以 #game 的 grid item 身份参与
     布局,而不是被"困"在各自父级的盒子里只能整体挪动。*/
  @media (min-width:1024px){
    /* .wrap 的基础规则(见文件靠前的 .wrap{max-width:880px;...})是给竖排/窄屏内容设计的
       宽度上限——桌面布局这套4列grid(座位区3列+日志专属1列)天然需要比880px更宽的空间
       才能舒展,继续受这个上限约束会让#game被迫挤在一条880px的窄带里,座位区和视口边缘
       之间留出大片空白,日志列也会被连带挤扁。这里用:has()按#game是否带desktop-layout
       这个class判断(和上面@media(max-height:460px)里.wrap:has(#game:not(.hidden))
       同一个既有写法,#game是.wrap的直接子元素,不需要新增JS/新增class去传递这个状态),
       取消max-width限制,让.wrap(以及它唯一真正需要撑开的孙子#game)能撑满到接近整个
       视口宽度(减去.wrap自身padding)。 */
    .wrap:has(#game.desktop-layout){ max-width:none; }
    #game.desktop-layout{
      display:grid;
      /* 第4步新增第4列专门给日志面板——不和已经放 right 座位卡的第3列共用,
         座位/中央出牌区/信息条/手牌这些原有内容一律收在前3列(见下面各条
         grid-column 从 1/-1 改成 1/4),第4列从第1行到最后一行整列只属于日志面板。 */
      /* ===== 空间再分配(桌面布局第10步)=====
         中央列原来是 1fr,会无条件吞掉左右/日志列分配剩下的全部横向空间(真实测过1440px
         视口下高达712px)——但中央出牌区的实际内容需求远小于这个数:.exchange-card
         (52px迷你卡+8px*2内边距+1px*2边框≈70px)+6px间距,即使6张牌横排也只需要
         6*70+5*6=450px,712px里有超过260px是纯粹的视觉空白(截图里"寒冰剑"卡片两侧
         的大片空白正是这里来的)。改成 minmax(300px,420px)——上限420px仍能舒适容纳
         5张牌一行(420-16(tableStrip自身padding)=404,(404+6)/(70+6)≈5.4张),更极端
         的场景(6张以上)靠既有的flex-wrap优雅换行,不会挤压变形(已用真实截图验证,见
         CLAUDE.md)。
         【第11步修正】上一步把左/右/日志三列也全部改成有上限的minmax,导致四列总宽度
         不再撑满#game的全部可用宽度,只能靠 justify-content:center 把这个变窄的四列
         网格整体居中——代价是#game两侧留下大片对称的空白留白(真实测过1440px视口下
         左右各146px,合计292px,接近#game自身宽度的21%),看起来像"页面里嵌了一个偏小
         的居中区块",而不是真正撑满视口。真实原因:minmax(min,max)在满足max之后不会
         再接收多余空间,谁都不吸收就只能留给justify-content当外部留白。
         改法:中央列继续保持 minmax(300px,420px)固定上限(这是上一步已经用真实截图和
         多卡横排最坏场景验证过的合理宽度,不应该重新变宽把"中央区域本身空白过多"这个
         问题带回来);左/右/日志三列改用 minmax(min,Nfr)——fr 是"满足所有非fr轨道的
         尺寸后,把总剩余空间按权重分配"给这几条轨道,不再需要 justify-content 兜底,
         网格天然撑满#game的全部宽度。权重取 1:1:1.2(左:右:日志),日志略宽是因为
         日志文本本身受益于更宽的阅读区域。**这不会让座位卡"凭空变大"**:6~8人局座位
         卡的尺寸瓶颈依然是纵向空间(updateDesktopSeatHeights算出的高度),不是列宽——
         已用真实dump核实过5/7人局座位卡宽度(134.1px/96.1px)远小于180px这条旧上限,
         列宽从不是这几档人数的瓶颈,加宽后同样远小于新的、更宽的fr结果,不受影响。
         **左/右列变宽真正带来的改善是"我的座位卡"(meSeat)的结构性尺寸上限**:meSeat
         固定占据 grid-column:1,宽度不能超过这条列轨道当前的宽度,配合 aspect-ratio:
         3/4反推出的高度上限也跟着从180px列宽对应的240px一起变高——2~4人局(纵向预算
         宽裕、meSeat原本会撞到这个上限)因此能进一步放大;具体上限改由 render.js 动态
         测量这条列的实际渲染宽度决定,不再硬编码240这个数字(见 updateDesktopSeatHeights
         的对应修改)。
         【第12步修正,真实bug】:第11步把左/右列改成 minmax(100px,1fr) 之后,这两列的
         宽度不再由"里面的内容实际需要多宽"决定,而是完全交给 fr 权重瓜分剩余空间——真实
         测量确认这产生了大片黑色死区(1440px视口下左/右列各297.5px宽,但6~8人局的对手
         座位卡受纵向预算瓶颈只能长到111.6px宽,列内剩余185.9px完全空着;1920px视口下
         问题更严重,列宽被fr撑到447.5px,座位卡仍只有143.4px,死区扩大到304.1px/侧)。
         **根因**:对手座位卡(6~8人局)的尺寸瓶颈始终是纵向空间(updateDesktopSeatHeights
         算出的高度,受限于视口高度/行数,和列宽无关)——列越宽,座位卡也不会变宽(它的
         width由height按aspect-ratio 3/4反推,不会去stretch填满列),多出来的列宽只会
         变成纯粹的死区,不是"潜在的座位卡放大空间"。真正会用到这条列宽度的只有 meSeat
         (2~4人局,同样固定在grid-column:1)——用真实dump测过 meSeat 在最宽裕情形下
         (1920px,2/4人局)精确达到250×333.4px,这是它在当前公式下的理论/实测双重上限
         (由 ME_SEAT_RATIO*266.7对手高度上限反推,266.7*1.25*0.75=250.03)。
         **修法**:把左/右列从 minmax(100px,1fr) 改回固定上限 minmax(100px,260px)——
         260px比meSeat实测/理论最大宽度250px多留10px安全余量,不会让meSeat在任何已验证
         场景下被夹小(1440px下meSeat实测只有240.2px,1920px下250px,两者都在260px以内,
         该列宽度改动对meSeat自身尺寸没有任何影响),但把原本浪费给6~8人局对手座位卡
         的绝大部分死区直接收回(1440px:297.5→260,收回37.5px/侧；1920px:447.5→260,
         收回187.5px/侧)。日志列(第4列)从 minmax(220px,1.2fr) 改成 minmax(220px,1fr)
         ——继续是唯一的弹性(fr)列,吸收左右两列收窄后腾出的全部宽度,保证四列合计依然
         100%撑满#game(不引入 justify-content,不违反"页面已经真正撑满视口边缘,不要
         回退"这条硬约束)。日志面板变宽(1440px:357→432,1920px:537→912)是可以接受的
         结果而不是新问题——它是纯文本历史记录区,内容本身会自然按可用宽度换行/左对齐,
         不会像"固定宽高比的座位卡"那样在多余宽度里露出一整块无法被内容填补的空白;
         已用真实截图核实这个宽度下日志区域视觉上不显得空洞(见CLAUDE.md)。
         【第13步修正】用户反馈日志面板占用宽度过多、可用性上没有帮助,应该把这部分空间
         让给座位区。**真实测量确认一个此前被忽略的关键点**:单纯把左/右列的固定上限从
         260再调大,对座位卡尺寸**没有任何效果**——6~8人局对手座位卡受纵向预算瓶颈,尺寸
         早就远小于260px(不受列宽驱动);meSeat(2~4人局)当时的理论/实测上限恰好也只有
         250px(由 render.js 里一个历史遗留的 266.7px 高度硬上限反推而来,`266.7×1.25×
         0.75=250.03`),260px列宽已经完全够用、从未被列宽本身卡住过。**真正能让座位卡
         明显变大的是先在 render.js 里把那个 266.7px 的历史legacy高度上限抬高到 400px**
         (真实dump测过:1920×1080下2~4人局的纵向预算其实原本就有336.2px可用,却被这个
         legacy常数白白夹掉69.5px；1440×900下同样的2~4人局场景、以及两档分辨率下的
         5~8人局场景,纵向预算本来就低于266.7,不受这次调整影响)——**抬高高度上限之后,
         meSeat 的新理论/实测上限变成 315.2px 宽(400×1.25×0.75,四舍五入留量),这时
         列宽才第一次真正成为限制 meSeat 能不能长到这么大的瓶颈**,左/右列因此需要同步
         加宽去配合这个新的、真正会被用上的宽度需求——**这两处改动必须同时做,只做其中
         一个都不会有效果**(只抬高度上限而不加宽列会让 meSeat 被列宽重新夹回旧上限；
         只加宽列而不抬高度上限,meSeat 仍然会停在旧的250px理论值,列宽白白多出的部分
         继续是死区)。
         **真实测量还发现一个容易被忽略的细节,直接决定了不能简单把这个更宽的列宽写死成
         一个固定值**:1440×900 下 meSeat 的真实需求本来就只有 240.2px(该分辨率下的
         纵向预算,不受这次抬高的400px上限影响——1440×900的solvedHeight本来就没到旧的
         266.7,更不会到400),260px列宽在1440×900下已经绰绰有余,**加宽到330px在这个
         分辨率下对座位卡没有任何帮助,只是白白多占30px列宽、直接从日志列身上抢走这30px
         (×2列=60px)**,和这次任务"把日志的宽度让给座位区"的方向恰好相反——330px这个
         数字只对1920×1080下meSeat新解出的315.2px需求有意义。**修法:用响应式断点让
         每档分辨率各自只拿自己实际需要的列宽,不多占**:这里(min-width:1024px 桌面
         基础断点)维持 260px(覆盖1440×900下240.2px的真实需求,留小余量),新增一个
         @media(min-width:1700px)(1440和1920之间取的分界值,干净地把这次测试的两档
         分辨率分开,写在紧邻这个 `#game.desktop-layout{...}` 规则块结束之后、只覆盖
         grid-template-columns 这一条属性,不重复声明 grid-template-rows/column-gap/
         align-items 等其它属性——这几项两档分辨率完全一样,不需要在更窄的断点里覆盖
         第二次)专门加宽到330px(覆盖1920×1080下315.2px的真实需求)。这样1440×900下
         日志列不会被无谓抢走60px列宽,可以把这部分空间还给日志(实测见下方验证记录),
         1920×1080下座位卡则能吃到真正需要的330px。 */
      grid-template-columns:minmax(100px,260px) minmax(300px,420px) minmax(100px,260px) minmax(220px,1fr);
      /* 第8步:me+手牌合并进同一行后,总行数从8收紧到7(座位区3行+信息条/武将名/手牌标签
         各1行+合并后的me+手牌1行),没有空行,不会因为"预留了一行却没人占用"而多出一段
         意外的行间距(row-gap 对每条相邻track都生效,哪怕某条track是空的)。 */
      grid-template-rows:repeat(7,auto);
      column-gap:12px; row-gap:8px;
      align-items:start;
    }
    /* 【第13步】1920×1080(及更宽视口)专属:左/右列上限从基础断点的260px加宽到330px,
       只覆盖 grid-template-columns 这一条属性——其余 grid-template-rows/column-gap/
       row-gap/align-items 沿用 min-width:1024px 那个块里已经声明好的值,不用重复写。
       断点选1700px是1440和1920之间随意取的一个分界点,只要干净地把这次任务实测覆盖的
       两档分辨率分开即可,不是什么精确计算出来的临界值。 */
    @media (min-width:1700px){
      #game.desktop-layout{
        grid-template-columns:minmax(100px,330px) minmax(300px,420px) minmax(100px,330px) minmax(220px,1fr);
      }
    }
    #game.desktop-layout #oppRow{ display:contents; }
    #game.desktop-layout .bottom-row{ display:contents; }
    /* top: 最多3个(assignSeatZones 的 topCount 上限)——Grid 原生不支持"多个item共享同一
       grid-area 时自动横向排开"(同区域内的item默认会叠在一起),之前给每张top座位卡各自
       精确写 grid-column:1/2/3 是绕开这个限制的权宜写法,但那要求"每个座位卡都是#game这个
       grid的直接item"这个前提——一旦引入#oppTopRow这个真实的flex容器,top座位卡就不再是
       #game的直接item了,不需要也不能再各自精确定位。改成#oppTopRow整体占据grid-column:
       1/4(横跨left到right三列的宽度)+grid-row:1这一个区域,内部用display:flex让最多3张
       座位卡自然横向排开、不重叠——它不像#oppRow那样用display:contents打散,而是一个
       真实的flex容器,因为它需要自己的flex布局上下文来排布top这几张卡片。gap/padding
       比照.opp-row的既有数值,保持视觉一致。 */
    #game.desktop-layout #oppTopRow{
      grid-column:1 / 4; grid-row:1;
      display:flex; justify-content:center; gap:8px; padding:8px 8px 4px;
    }
    /* left: 最多2个,纵向排在最左列的第2/3行 */
    #game.desktop-layout .seat[data-zone="left"][data-zone-index="0"]{ grid-column:1; grid-row:2; }
    #game.desktop-layout .seat[data-zone="left"][data-zone-index="1"]{ grid-column:1; grid-row:3; }
    /* right: 最多2个,纵向排在最右列(第3列)的第2/3行 */
    #game.desktop-layout .seat[data-zone="right"][data-zone-index="0"]{ grid-column:3; grid-row:2; }
    #game.desktop-layout .seat[data-zone="right"][data-zone-index="1"]{ grid-column:3; grid-row:3; }
    /* 中央出牌区:居中列,纵向跨第2/3行(和左右两列的座位卡对齐同一区块)。
       【第11步修正】align-self 从 center 改成 stretch——原来的 center 会把 #tableStrip
       这个64px高的小盒子在row2/3合并空间(6~8人局时由左右座位卡撑到约300px高)里居中
       悬浮,视觉上在它上方和下方各留出一大截"看起来像没用上的空白"(真实截图确认:玩家1/2/3
       这排座位卡和下方出牌区之间有明显的大段间隙,这正是这段悬浮留白造成的),这也是本次
       用户反馈"座位卡和出牌区离得太远、不够紧凑"的直接来源。改成 stretch 后 #tableStrip
       的背景(rgba(20,15,10,.55)+上下细线)会铺满整个row2/3的高度,和上方座位卡紧接、和
       下方信息条紧接;它内部的实际内容(#tableCard,靠.table-strip自身的
       display:flex;align-items:center;justify-content:center)仍然在这个铺满的背景区域
       内部保持垂直居中,不会显得内容贴边——从"一个悬浮在大片空白中间的小盒子"变成"一块
       尺寸得当、内容居中的背景区域",视觉上明显更紧凑。**这纯粹是外观调整,不影响座位卡
       高度计算**:updateDesktopSeatHeights()的公式从不读取#tableStrip的位置/尺寸(这是
       "整体自适应"任务里为了消除circular dependency已经改掉的既有设计),align-self
       改变多少都不会影响座位卡最终算出的px数值。 */
    #game.desktop-layout #tableStrip{ grid-column:2; grid-row:2 / span 2; align-self:stretch; }
    /* 以下几项这一步只给"各占一整行、按顺序往下排"的兜底位置,不做内容密度优化;
       行号相应从原来的5/6/7上移一行(第8步me+手牌合并后腾出了原来me单独占用的那一行)。
       空间再分配(第10步):这三行从 grid-column:1/4(只占前3列,不侵入日志列)改成
       1/5(横跨全部4列,含日志列)——**这不会和日志面板打架**:#log-panel 是
       grid-row:1/span 3(只占对手区那3行),而这三行分别在 row4/5/6,纵向完全不重叠,
       扩展到日志列的宽度对日志面板没有任何视觉侵入。这么改的动机是:中央出牌区列收窄
       到 minmax(300px,420px) 之后,这三行(尤其 #myGeneral,武将名+技能+完整描述,
       颜良文丑这类最长描述真实测过会在收窄后的1/4范围内换行到2行,吃掉不可预测的
       纵向空间)可用宽度从原来1096px收窄到804px,换行风险明显变大——横跨到日志列
       (总宽度恢复到1408px-2*180-2*12=1024px量级,比原1096px更宽裕,因为不用再扣除
       中间那条现在更窄的中央列)之后,重新验证长描述不再换行(见CLAUDE.md記錄的真实
       测量结果:myGeneral从两行33px高的换行状态恢复回单行16.5px)。 */
    #game.desktop-layout .panel.table{ grid-column:1 / 5; grid-row:4; }
    #game.desktop-layout #myGeneral{ grid-column:1 / 5; grid-row:5; }
    #game.desktop-layout .hand-label:not(#myGeneral){ grid-column:1 / 5; grid-row:6; }
    /* 第8步:我的座位卡+手牌合并成同一行——me固定用第1列(和left/right座位卡共用
       同一条列轨道,宽度天然保持一致,不需要另外定义一组新的列宽),手牌占第2~3列
       (剩余宽度,即中央+right那两条列轨道合起来的宽度)。原来两者各自占一整行、
       me还用justify-self:center让自己在1/4这个跨列范围内居中——现在两者在同一行
       分别落在各自固定的列里,不再需要justify-self这个居中手段。 */
    #game.desktop-layout #meSeat{ grid-column:1; grid-row:7; }
    #game.desktop-layout #hand{ grid-column:2 / 4; grid-row:7; }
    /* 第9步修复:.seat.me 的基础规则(见文件靠前的 .seat.me{width:220px;max-width:260px})
       是给窄屏/flex布局场景设计的——.opp-row 用 flex,对手数量少时 flex:1 会把单个对手撑到
       200px 上限,"我"的座位卡如果还是 180px 反而比对手更窄,和"更大、更醒目"的设计意图
       矛盾,所以显式定死 220px(Playwright 实测抓到的真实问题,见那条注释)。但这次 me
       座位卡改用 grid-column:1 后,分到的是这条列轨道 minmax(100px,180px) 的宽度,220px
       会直接超出这个空间、溢出到 grid-column:2/4 (#hand 所在的列),和手牌区域产生真实
       重叠(实测过:me 宽度220px、和 #hand 之间 gap 为负值)。"对手行flex撑宽"这个原始
       问题在这里不成立——desktop 布局下 me 和对手的列宽都是 grid 固定分配、互不影响,
       不存在"对手被撑宽导致我显得更窄"这回事,所以这里安全地把宽度收窄回和 grid-column:1
       一致的180px,不影响.seat.me基础规则本身(那条220px仍然只在窄屏/flex模式下生效),
       也不碰 left/right 座位卡(选择器只限定 .seat.me,不会命中它们)。写法参照上面
       .wrap:has(#game.desktop-layout) 这条"用desktop-layout作用域覆盖旧规则"的既有模式,
       保持风格一致。 */
    /* 【第13步修正,真实bug】:第10步删除桌面专属的180px固定宽度覆盖之后,`.seat.me`
       的**基础规则**(文件靠前 `.seat.me{width:220px;max-width:260px}`,窄屏/flex布局
       场景设计,第10步之前从未在桌面布局下真正生效过,因为当时还有桌面专属的180px覆盖
       挡着)重新变得"没有任何桌面专属规则覆盖它"——`max-width:260px` 这条基础规则的
       限制因此第一次真正在桌面布局下生效。这次(第13步)抬高 render.js 里座位卡高度
       上限、加宽左右列宽到330px想让 meSeat 长到 315.2px 宽时,真实测量发现 meSeat 实际
       只渲染到 260px 宽、且高度420.3px与宽度260px已不再是3:4——**aspect-ratio 被这条
       遗忘已久的 max-width:260px 基础规则重新夹住了**,和本次任务前面 index.html 里已经
       记录过的"log-panel 遗留 width:260px 覆盖"是同一类"移除了一部分覆盖、没意识到还有
       另一条不相关的旧规则在暗中生效"的坑。修法:desktop-layout 范围内新增一条覆盖,把
       max-width 显式放开(不设固定数字,交给 JS 动态算出的 height+aspect-ratio 决定实际
       宽度,和对手座位卡 max-width:none 那条同一处理原则),不影响窄屏/flex布局下这条
       基础规则本身继续生效。 */
    #game.desktop-layout .seat.me{ max-width:none; }
    /* 空间再分配(桌面布局第10步)：这条 180px 固定覆盖已删除——meSeat 的尺寸现在和对手
       座位区一样交给 updateDesktopSeatHeights()(render.js)动态计算,不再是一个和对手区
       预算无关的固定切片。**根因**:meSeat 之前固定 width:180px(height 由 aspect-ratio
       反推=240px)是一块不参与"整体自适应"那次任务算出的共享纵向预算的刚性开销——
       6~8人局对手区已经被压缩到很小,而"我"的卡却始终占用240px纵向空间,造成"座位卡
       明显偏小"(用户反馈的真实现象,真实测过:6~8人局对手卡只有96.1×128.2,和meSeat的
       180×240相比明显不成比例)。现在 JS 按"meSeat应比对手卡高出固定倍率(1.25倍)"
       和对手卡的高度联立求解(同一个总预算里的两个未知数,不是先后独立各算各的),这样
       meSeat 会随对手区一起收缩/放大,不再是与对手区脱节的固定值。
       **为什么 meSeat 的高度必须夹在≤240这个上限**:meSeat 固定占据 grid-column:1
       (和 left 区座位卡共用同一条 minmax(100px,180px) 列轨道),它的宽度不能超过这条
       列轨道的180px上限,配合 aspect-ratio:3/4 反推,高度上限因此是 180/0.75=240px——
       这不是新加的限制,是列宽结构本来就有的约束,JS 计算时会把这个240当作硬上限,和
       对手卡的90~266.7上下限是同一类"由布局结构决定、不能凭空取更大值"的道理。 */
    /* ===== 桌面自适应 步骤a:对手区座位卡尺寸驱动方向反转 =====
       和"手机横屏矮视口"(@media(max-height:460px) and (orientation:landscape))那次
       同一手法——高度当主动变量、宽度靠 aspect-ratio 反推,不再是"设宽度、aspect-ratio
       反推高度"(base rule 的方向,在桌面 2 人局这个最简单场景下就已经会让页面溢出,
       见 CLAUDE.md 记录的真实测量数据)。**这里只清空会和"JS内联style设height"打架的
       约束(flex/min-width/max-width),不在CSS里写死height——height必须由
       updateDesktopSeatHeights()(render.js)按"这一局实际用了几行对手区(1~3行,取决
       于人数)"动态算出来再回写内联style,不能像手机那次一样用固定dvh clamp硬编码
       (手机那次对手区永远只有1行,桌面这次行数本身是变量)。
       只作用于对手座位(#oppTopRow 里的 top 区 + #oppRow 里的 left/right 区),不碰
       .seat.me——"我"的卡沿用上面已有的180px固定宽度,保持"比对手更醒目"这条既有
       设计规则(verify_stage1_seatcard.js 锁定的既有回归)不变。
       【第12步新增 justify-self:center】:左/右列收窄到260px上限之后(见上面
       grid-template-columns那条注释),6~8人局的对手座位卡(纵向预算瓶颈下只有
       ~110~150px宽)相对260px列宽仍会留一截残余空隙——这条规则把座位卡在自己所在的
       grid区域内水平居中,让这截空隙从"整段贴在列的一侧、看起来像没用上的一大块"
       变成"卡片左右各留一小段对称间距",读起来更像是有意的卡片留白而不是布局缺陷。
       justify-self 只对真正的 grid item(#oppRow .seat[data-zone],因为 #oppRow 是
       display:contents)生效;#oppTopRow .seat 是 flex 子项(#oppTopRow 自己才是
       grid item),justify-self 对 flex 子项无效,写在同一条规则里是无害的空操作,
       它们的水平居中已经由 #oppTopRow 自身的 justify-content:center 保证,不冲突。 */
    #game.desktop-layout #oppTopRow .seat,
    #game.desktop-layout #oppRow .seat[data-zone]{
      flex:0 0 auto; min-width:0; max-width:none; width:auto;
      justify-self:center;
    }
    /* 第4步:日志面板挪到独立的第4列;第8步收紧成grid-row:1 / span 3——只覆盖座位区
       (top/left/right)+中央出牌区这3行,不再一路占满到底(原来是1/-1占满全部7行,
       会一路盖到"我+手牌"合并后的那一行)。用span而不是写死结束行号(比如1/4),
       是为了以后座位区行数变化(或者日志下面要插入别的内容,比如聊天框)时,只需要
       改这里的span数字,不用重新计算"到底该到第几行"这个绝对行号。
       它是独立于座位区域的常驻信息区,不需要跟着座位卡的行高走,内容多了自己滚动
       (overflow-y:auto 是 .log-panel 基础规则里本来就有的)。
       #game.desktop-layout{align-items:start} 这条父级设置会让网格项默认按内容
       自身高度顶部对齐、不拉伸——这里必须显式 align-self:stretch 覆盖回来,否则
       "占满整列高度"不会生效,只会显示成顶部一小块。
       max-height 也要放开(基础规则里窄屏/常规宽屏用的132px上限不再适用),改成
       height:100%(配合 stretch 撑满的高度)+ overflow-y:auto 处理超出内容的滚动。
       position:fixed 是 @media(min-width:900px) 那条更早的宽屏覆盖规则(900px<1024px
       的桌面布局阈值,两者会同时命中)——fixed 定位元素完全脱离文档流,不participate
       任何 grid 布局,必须在这里显式覆盖回 position:static 才能让它重新参与 grid
       定位;这条选择器同时包含 #game 的 id 和 .desktop-layout/.log-panel 两个 class,
       特异性天然高于 900px 断点那条纯 class 选择器,不依赖源码顺序也能赢,但仍然按
       约定写在源码更后面。 */
    /* 【第11步修复,真实bug】:上面这条规则原来只覆盖了 position/align-self/max-height/
       height/margin-top,漏了 width——@media(min-width:900px) 那条更早的规则(见其
       说明注释)还留着 width:260px,这里只把 position 从 fixed 改回 static 让它重新
       参与 grid 布局,但 width:260px 这个值从未被覆盖掉,一直原样生效。position:static
       之后它是一个真正的 grid item,默认应该 stretch 铺满所属列轨道的完整宽度(第4列,
       本次改成 minmax(220px,1.2fr) 之后在 1440px/1920px 视口下能分到 357px/更宽),
       但 width:260px 这个显式声明会覆盖掉这个默认的 stretch 行为,导致日志面板一直
       卡在 260px、右侧空出一大截——真实测过:1440px视口下留白97px,1920px视口下留白
       277px,和"网格总宽度已经撑满#game、但#logPanel自己没有跟着变宽"这个现象完全
       对应。补一行 width:auto 显式恢复 grid item 默认的 stretch 行为。 */
    #game.desktop-layout .log-panel{
      grid-column:4; grid-row:1 / span 3;
      position:static; align-self:stretch;
      max-height:none; height:100%; width:auto;
      margin-top:0;
    }

    /* ===== 桌面自适应 步骤b:压缩剩余固定开销 =====
       步骤a只处理了对手座位区(动态算高度),但页面总高度还包含一批"和人数无关、
       全程固定"的开销——标题栏/信息条/武将名行/页脚提示——这些从未对视口高度做过
       预算,一直是各自 auto 撑开,在2人局(只用1行对手区)下就已经让整页溢出52px
       (步骤a验证时实测得到的数字,不是猜的)。这里复用"手机横屏矮视口"
       (@media(max-height:460px) and (orientation:landscape))同一套压缩手法——
       只是数值上没有手机那么极限,毕竟桌面这次紧张的只是纵向预算,横向空间依然
       宽裕,不需要像手机断点那样把字号压到8~9px的极限。
       **作用域严格限定在"桌面布局+游戏已经开始"这个交集**:用 :has()/兄弟选择器
       判断 #game 同时带 desktop-layout(宽屏)和不带 hidden(已开局)两个条件——
       大厅阶段(#game 带 hidden)即使在宽屏下也维持原来宽松的标题栏/页脚,这两个
       条件缺一都不生效,和手机断点"仅游戏中收紧"的既有原则一致。*/
    .wrap:has(#game.desktop-layout:not(.hidden)){padding:10px 16px 10px;}
    /* 【座位卡最大化任务:方向1】标题栏原来只是缩小字号(18px)保留显示,这次改成
       完全隐藏——和 .sub 副标题同一处理原则(见下一条规则):它是纯装饰性的品牌文字,
       游戏进行中的桌面视角完全不需要,继续占用哪怕缩小后的一行也是纯粹的纵向死重。
       真实测过:隐藏后 #game 的 top 位置相应上移(从原来 h1 占的位置开始),没有产生
       任何布局跳动或错位——:has()/兄弟选择器的判断条件不变,依然只在"桌面布局+已开局"
       这个交集生效,大厅阶段标题栏正常显示。 */
    .wrap:has(#game.desktop-layout:not(.hidden)) h1{display:none;}
    .wrap:has(#game.desktop-layout:not(.hidden)) .sub{display:none;}
    /* footnote("部署后…"这类大厅提示)在已开局的桌面视角下同样是死重——和手机断点
       #game:not(.hidden) ~ .footnote 那条完全同一原理,这里额外加 .desktop-layout
       限定,避免在<1024px的窄屏正常游玩(非矮视口横屏)时也被这条规则命中——那个
       场景footnote本来就不是这次要处理的对象,窄屏是否要隐藏footnote不在本次范围。 */
    #game.desktop-layout:not(.hidden) ~ .footnote{display:none;}

    /* 【第11步】margin-bottom 从 6px 收紧到 4px——这是排查"座位卡还有没有更多可挤纵向
       预算"时顺带找到的一处小空间,不是本次任务的主要来源(主要来源是横向留白+#tableStrip
       悬浮间隙),但既然在查、也一并收紧,给6~8人局座位卡再挤出几px。
       【座位卡最大化任务:方向1】padding/margin/gap 进一步收紧(5px→3px、4px→2px、
       3px→2px)——**不再继续压 phase-pill/deckinfo/banner/controls 这几项的字号**
       (11~12px 已经是之前几轮压缩的下限,继续压会牺牲可读性,这次刻意不碰),只在
       纯粹的间距(padding/margin/gap)上继续找空间,真实测过这几px的收紧不影响任何
       文字的可读性,只是让内容彼此贴得更紧一点。 */
    #game.desktop-layout .panel.table{padding:3px 8px;margin:0 0 2px;gap:2px 10px;}
    #game.desktop-layout .phase-pill{padding:2px 10px;font-size:11px;}
    #game.desktop-layout .deckinfo{font-size:11px;}
    #game.desktop-layout .banner{padding:5px 10px;margin:2px 0 0;font-size:12px;}
    #game.desktop-layout .controls{gap:6px;margin-top:2px;}
    #game.desktop-layout .controls button{padding:5px 10px;font-size:12px;}

    /* myGeneral(自己的武将名+技能+完整描述)和"你的手牌"标签共用 .hand-label 这个
       class,base rule 的 margin:14px 0 8px 是给宽松布局设计的——桌面这套紧凑布局
       不需要这么大的呼吸间距,压到 6px 0 4px(两处各省 12px,合计 24px)。**不隐藏
       描述文字**(和手机断点的 #myGeneral span{display:none} 不同)——手机那样做
       是因为窄宽度下长描述容易换行、吃掉不可预测的纵向空间,桌面宽度(880~1096px)
       远比手机宽裕,换行风险低得多,没有必要为了省这点高度牺牲这条信息。 */
    /* 【第11步】margin 从 6px/4px 收紧到 4px/3px(同一处顺带收紧,理由同上面panelTable
       那条注释)——myGeneral 和"你的手牌"标签共用这条规则,各省3px,合计再收紧6px。
       【座位卡最大化任务:方向1】继续收紧到 2px/1px(同样只动margin,不动font-size:
       11px这个已经是下限的字号)——myGeneral 和"你的手牌"标签共用这条规则,这次每处
       再省2px,两处合计再收紧4px。 */
    #game.desktop-layout .hand-label{font-size:11px;margin:2px 0 1px;}

    /* ===== 经典桌面牌桌布局 =====
       只重排宽屏游戏界面，不改变座位 DOM、点击事件或任何游戏状态。
       目标结构参考传统三国杀客户端：对手在上/左右，自己在左下，手牌在底部中央，
       中央区域只负责出牌与判定，日志固定在最右侧。

       座位尺寸在这里最终交给 CSS；!important 只用于覆盖 render.js 旧版桌面自适应
       每轮渲染写入的 inline width/height。这样状态同步时不会经历“CSS 初始尺寸 →
       JS 重新测量尺寸”的视觉跳变。窄屏规则不在这个 media 范围内，完全不受影响。 */
    .wrap:has(#game.desktop-layout:not(.hidden)){
      width:100%;
      min-height:100dvh;
      padding:10px 14px;
      box-sizing:border-box;
    }
    #game.desktop-layout{
      width:100%;
      height:calc(100dvh - 20px);
      min-height:0;
      box-sizing:border-box;
      grid-template-columns:
        minmax(140px,220px)
        minmax(360px,1fr)
        minmax(140px,220px)
        minmax(270px,320px);
      grid-template-rows:
        clamp(165px,23dvh,220px)
        minmax(200px,1fr)
        auto
        auto
        auto
        clamp(190px,25dvh,250px);
      column-gap:10px;
      row-gap:6px;
      align-items:stretch;
      overflow:hidden;
    }
    #game.desktop-layout #oppTopRow{
      grid-column:1 / 4;
      grid-row:1;
      min-width:0;
      padding:0 6px;
      gap:8px;
      align-items:stretch;
      justify-content:space-evenly;
      overflow:hidden;
    }
    #game.desktop-layout #oppTopRow .seat{
      flex:0 1 180px;
      width:auto!important;
      height:auto!important;
      min-width:0;
      max-width:180px;
      max-height:100%;
      aspect-ratio:3 / 4;
      align-self:stretch;
    }
    /* 1~9人局人数分支：
       2~4人局的1~3名对手可以保持较大的顶部座位；7/8人局顶部达到4/5名时，
       只收紧顶部卡片上限，不改动整张牌桌的列宽，因此出牌过程中布局不会跳档。
       9人局(Team模式)顶部6名对手(assignSeatZones 输出 top6+left1+right1)，
       6×125px+5×8px gap≈790px，小于 top 行可用宽度(~890px 起)，容纳得下。 */
    #game.desktop-layout #oppTopRow:has(> .seat:nth-child(4)) .seat{
      max-width:165px;
    }
    #game.desktop-layout #oppTopRow:has(> .seat:nth-child(5)) .seat{
      max-width:145px;
    }
    #game.desktop-layout #oppTopRow:has(> .seat:nth-child(6)) .seat{
      max-width:125px;
    }
    /* 单人调试局没有任何对手。隐藏空的顶部轨道，并让中央桌面接管上半区；
       正常2~8人局不会命中这两条。 */
    #game.desktop-layout:has(#oppTopRow:empty){
      grid-template-rows:
        0
        minmax(260px,1fr)
        auto
        auto
        auto
        minmax(190px,27dvh);
    }
    #game.desktop-layout:has(#oppTopRow:empty) #oppTopRow{
      display:none;
    }
    #game.desktop-layout:has(#oppTopRow:empty) #tableStrip{
      grid-column:1 / 4;
      grid-row:1 / 3;
    }
    #game.desktop-layout #oppRow .seat[data-zone="left"],
    #game.desktop-layout #oppRow .seat[data-zone="right"]{
      width:min(100%,200px)!important;
      height:auto!important;
      max-width:200px;
      max-height:100%;
      aspect-ratio:3 / 4;
      align-self:center;
      justify-self:center;
    }
    #game.desktop-layout .seat[data-zone="left"]{
      grid-column:1!important;
      grid-row:2!important;
    }
    #game.desktop-layout .seat[data-zone="right"]{
      grid-column:3!important;
      grid-row:2!important;
    }
    #game.desktop-layout #tableStrip{
      grid-column:2;
      grid-row:2;
      min-width:0;
      min-height:180px;
      align-self:stretch;
      border:1px solid var(--line);
      border-radius:10px;
      background:
        radial-gradient(circle at center,rgba(112,82,38,.12),transparent 64%),
        rgba(20,15,10,.55);
    }
    #game.desktop-layout .panel.table{
      grid-column:1 / 4;
      grid-row:3;
      margin:0;
    }
    #game.desktop-layout #myGeneral{
      grid-column:1 / 4;
      grid-row:4;
    }
    #game.desktop-layout .hand-label:not(#myGeneral){
      grid-column:1 / 4;
      grid-row:5;
    }
    #game.desktop-layout #meSeat{
      grid-column:1;
      grid-row:6;
      min-width:0;
      display:flex;
      align-items:end;
      justify-content:center;
      overflow:hidden;
    }
    #game.desktop-layout #meSeat .seat{
      width:min(100%,220px)!important;
      height:auto!important;
      max-width:220px;
      max-height:100%;
      aspect-ratio:3 / 4;
    }
    #game.desktop-layout #hand{
      grid-column:2 / 4;
      grid-row:6;
      min-width:0;
      min-height:0;
      align-self:end;
      justify-content:center;
      align-content:end;
      flex-wrap:nowrap;
      gap:12px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:72px 4px 2px;
      box-sizing:border-box;
    }
    /* Chrome 100%缩放是桌面端的设计基准。手牌不再沿用全局64×92的小尺寸；
       手牌过多时横向滚动，不通过缩小整排卡片来硬塞。 */
    #game.desktop-layout #hand .card{
      width:118px;
      height:168px;
      flex:0 0 auto;
      --badge:22px;
    }
    /* 原来的2.2倍预览会超过底部轨道高度，被横向滚动容器裁掉。电脑端改为在预留的
       上方空间内放大，仍足够看清牌面，但不会被桌面区域盖住。 */
    @media (hover:hover) and (pointer:fine){
      #game.desktop-layout #hand .card:hover{
        transform:translateY(-14px) scale(1.48);
      }
    }
    /* 中央出牌、判定和交换牌提高一级视觉权重。这里只改展示尺寸，DOM和动画逻辑不变。 */
    #game.desktop-layout #tableStrip .table-card-mini{
      width:92px;
      height:132px;
    }
    #game.desktop-layout #tableStrip .exchange-card .table-card-mini{
      width:78px;
      height:112px;
    }
    #game.desktop-layout #tableStrip .table-card-name{font-size:25px;}
    #game.desktop-layout #tableStrip .table-card-face{font-size:18px;}
    #game.desktop-layout .log-panel{
      grid-column:4;
      grid-row:1 / 7;
      height:auto!important;
      min-height:0;
      max-height:none;
      overflow-y:hidden;
      overscroll-behavior:contain;
      scrollbar-gutter:stable;
      scrollbar-width:thin;
      scrollbar-color:var(--gold-dim) rgba(0,0,0,.28);
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(17,13,10,.92);
      display:flex;
      flex-direction:column;
    }
    #game.desktop-layout .log-panel::-webkit-scrollbar{width:10px;}
    #game.desktop-layout .log-panel::-webkit-scrollbar-track{background:rgba(0,0,0,.28);}
    #game.desktop-layout .log-panel::-webkit-scrollbar-thumb{
      background:var(--gold-dim);
      border-radius:8px;
      border:2px solid rgba(0,0,0,.28);
    }
    #game.desktop-layout .log-panel-head{
      position:sticky;
      top:0;
      z-index:2;
      margin:0 0 5px;
      padding:6px 4px;
      color:var(--gold);
      font-weight:700;
      background:rgba(17,13,10,.98);
      border-bottom:1px solid var(--line);
    }
    /* 选将列表的高度取决于候选武将说明，不能塞进固定一屏牌桌。检测到选将列表时
       临时恢复正常文档高度和页面纵向滚动；选择结束后列表消失，自动回到固定牌桌。 */
    #game.desktop-layout:has(.general-pick-list){
      height:auto;
      min-height:calc(100dvh - 20px);
      overflow:visible;
    }
    #game.desktop-layout:has(.general-pick-list) .log-panel{
      position:sticky;
      top:10px;
      align-self:start;
      height:calc(100dvh - 20px)!important;
      max-height:calc(100dvh - 20px);
    }

    /* 1366×768一类常见笔记本的浏览器内容区通常只有约620~680px高。直接按100%
       缩放压缩纵向轨道，不要求用户把Chrome调成90%。 */
    @media (max-height:760px){
      #game.desktop-layout{
        grid-template-rows:
          clamp(125px,21dvh,155px)
          minmax(130px,1fr)
          auto
          auto
          auto
          clamp(145px,24dvh,175px);
      }
      #game.desktop-layout #myGeneral span{display:none;}
      #game.desktop-layout #oppTopRow .seat{max-width:145px;}
      #game.desktop-layout #oppTopRow:has(> .seat:nth-child(4)) .seat{max-width:125px;}
      #game.desktop-layout #oppTopRow:has(> .seat:nth-child(5)) .seat{max-width:110px;}
      #game.desktop-layout #meSeat .seat{max-width:155px;}
      #game.desktop-layout #hand{padding-top:36px;}
      #game.desktop-layout #hand .card{width:100px;height:143px;--badge:20px;}
      #game.desktop-layout #hand .card:hover{transform:translateY(-6px) scale(1.25);}
      #game.desktop-layout #tableStrip .table-card-mini{width:80px;height:114px;}
      #game.desktop-layout #tableStrip .exchange-card .table-card-mini{width:68px;height:98px;}
    }

  }

  /* ===== 平板布局 =====
     覆盖常见 7~13英寸平板：641~1199px，以及宽度更大但仍是触屏/粗指针的设备。
     平板不进入电脑四列牌桌；日志回到文档流，避免固定在右侧盖住座位和手牌。 */
  @media (min-width:641px) and (max-width:1199px),
         (min-width:641px) and (hover:none) and (pointer:coarse){
    .wrap{max-width:1100px;padding:10px 12px;}
    .opp-row{gap:7px;padding:6px 6px 4px;}
    .opp-row .seat{max-width:170px;}
    .bottom-row{gap:10px;}
    .hand{gap:8px;}
    .hand .card{width:88px;height:126px;--badge:19px;}
    .table-card-mini{width:76px;height:106px;}
    .exchange-card .table-card-mini{width:64px;height:90px;}
    .log-panel{
      position:static;
      width:auto;
      max-height:110px;
      margin-top:8px;
    }
  }

  /* CORE-86(issue #133):平板触控目标尺寸。基础 button 规则(padding:9px 16px +
     font-size:14px)算出来的实际高度约 40px,低于触屏 44px 的通行下限——鼠标点击 40px
     完全够用,手指点就偏小了。
     【为什么单独开一条 @media、不并进上面那块平板规则】上面那块的第一个分支
     (min-width:641px) and (max-width:1199px) 只看宽度,手机横屏(如 iPhone SE 横屏
     667×375)宽度 667 同样落在这个区间里。第一版实现直接写进那块,实测把手机横屏的页面
     总高从 382px 抬到了 403px——那个视口只有 375px 高、本来就已经在溢出边缘,等于让一个
     已经吃紧的档更吃紧,违反 issue"手机零回归"的验收要求。这里补一条 (min-height:521px)
     的高度门槛把手机横屏排除掉:521 这个值和既有的手机横屏紧凑块
     (max-height:520px) and (orientation:landscape) and (pointer:coarse) 严格互补,不留
     空隙也不重叠——手机横屏继续走它自己那套刻意压小的紧凑尺寸,平板(最矮的 iPad 横屏
     也有 768px 高)才抬触控目标。这条是 CLAUDE.md 规则22"宽度和高度必须分别拉到下限单独
     测"的又一个实例:只按宽度分档就会把手机横屏误当平板。
     只提高度、不改 padding/font-size:min-height 不会把已经够高的按钮撑大,也不影响横向
     尺寸和文字排版,是这几个可选做法里对既有布局扰动最小的一个(实测 1024×768 到
     1366×1024 各档均无横向溢出、无换行变化)。
     选择器带 #controls(特异性 1,0,1)是刻意的:只抬游戏内的操作/响应按钮这一类真正需要
     手指点的目标,不用裸 button 一刀切——右上角 .icon-btn、AI 调试面板 .aitest-foot-btn
     这些工具类按钮各自有 class 规则(特异性 0,1,0)本来就压得住裸 button,写成裸 button
     反而会造成"有的生效有的不生效"这种看起来随机的结果,不如一开始就写清楚范围。 */
  @media (min-width:641px) and (max-width:1199px) and (min-height:521px),
         (min-width:641px) and (hover:none) and (pointer:coarse) and (min-height:521px){
    #controls button{min-height:44px;}
  }

  /* 平板竖屏：武将信息描述收起，给座位、操作区和手牌保留稳定空间。完整说明仍可
     通过武将牌上的“?”查看。 */
  @media (min-width:641px) and (max-width:900px) and (orientation:portrait){
    .wrap{padding:8px 10px;}
    #myGeneral span{display:none;}
    .hand-label{margin:7px 0 4px;}
    .bottom-row{gap:8px;}
    .seat.me{width:180px;}
  }

  /* 常见手机横屏即使宽度超过640px，也按紧凑触屏布局处理；原有≤640px手机竖屏
     规则继续负责更窄的设备。 */
  @media (max-height:520px) and (orientation:landscape) and (pointer:coarse){
    .hand .card{width:60px;height:86px;--badge:15px;}
    .table-card-mini{width:58px;height:80px;}
    .exchange-card .table-card-mini{width:50px;height:70px;}
  }

  /* ===== 背景视觉层（大厅视频 + 游戏内飘牌 Canvas） ===== */
  .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;background:transparent;}
  .bg-veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg, rgba(26,23,20,.40) 0%, rgba(26,23,20,.62) 100%);}
  .wrap{position:relative;z-index:2;}
  #gameBgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  .hidden{display:none!important;}
</style>
</head>
<body>
<!-- 大厅背景视频：装饰性视觉层。autoplay 策略要求 muted 才能无手势自动播放,
     故初始静音,用户首次交互后由 game-bg.js 自动恢复声音;
     src 由 pickRandomBgVideo() 随机设置；透明/加载失败时 body 渐变兜底 -->
<video id="bgVideo" class="bg-video" autoplay muted loop playsinline aria-hidden="true" tabindex="-1"></video>
<div id="bgVeil" class="bg-veil" aria-hidden="true"></div>
<!-- 说明浮层与帮助按钮:独立于 render 重建的容器,实时刷新不会关掉/清空 -->
<button id="helpBtn" class="icon-btn" title="规则 / 说明" onclick="showHelp()">?</button>
<button id="logBtn" class="icon-btn" title="查看完整日志" onclick="showLog()">📜</button>
<button id="closeRoomBtn" class="icon-btn hidden" title="关闭房间:删除本房间数据,所有人回到大厅">🚪</button>
<button id="debugLogBtn" class="icon-btn" title="查看调试日志(排查机器人卡死/报错用)" onclick="showDebugLog()">🐛</button>
<button id="aiTestBtn" class="icon-btn" title="打开AI托管信息窗" onclick="openAiTestModal()">🤖</button>
<button id="aiPanelBtn" class="icon-btn" title="查看AI决策(理由/武将/模型,含非托管机器人)" onclick="openAiPanelModal()">🧠</button>
<div id="myTurnBanner" class="my-turn-banner"></div>
<div id="infoModal" class="hidden"></div>
<div id="confirmModal" class="hidden"></div>
<div id="aiKeyModal" class="hidden"></div>
<div id="aiTestModal" class="hidden">
  <div class="aitest-panel">
    <div class="aitest-header">🤖 AI托管 <span id="aiTestStatus">未托管</span><button id="aiTestCloseBtn" class="aitest-close icon-btn" onclick="closeAiTestModal()">✕</button></div>
    <div class="aitest-body" id="aiTestBody"></div>
    <div class="aitest-footer">
      <button class="aitest-foot-btn" onclick="clearAiTestRecords()">清空</button>
      <button id="aiTestStartBtn" class="aitest-foot-btn" onclick="startAiTestAutopilot()">开始托管</button>
      <button id="aiTestStopBtn" class="aitest-foot-btn" onclick="stopAiTestAutopilot()" disabled>结束托管</button>
      <span class="aitest-hint">点击记录行展开详情</span>
    </div>
    <div class="aitest-resize-handle" title="拖动调整大小"></div>
  </div>
</div>
<!-- CORE-73:AI 决策查看面板。独立于托管开关(托管关着也能看各机器人座位的 AI 决策),
     复用 .aitest-* 全套样式与折叠记录结构;记录数据来自统一存储 aiDecisionRecords。 -->
<div id="aiPanelModal" class="hidden">
  <div class="aitest-panel">
    <div class="aitest-header">🧠 AI决策<button id="aiPanelCloseBtn" class="aitest-close icon-btn" onclick="closeAiPanelModal()">✕</button></div>
    <div class="aitest-body" id="aiPanelBody"></div>
    <div class="aitest-footer">
      <button class="aitest-foot-btn" onclick="clearAiTestRecords()">清空</button>
      <button id="aiPanelDownloadBtn" class="aitest-foot-btn" onclick="downloadAiDecisionDump()">下载本局</button>
      <span class="aitest-hint">点击记录行展开理由/武将/模型</span>
    </div>
    <div class="aitest-resize-handle" title="拖动调整大小"></div>
  </div>
</div>
<!-- 强制横屏软引导(骨架级重建阶段3):显隐逻辑纯 JS(render.js 的 checkLandscapeGate),
     这里只是静态结构,不含内联脚本。 -->
<div id="landscapeGate" class="landscape-gate hidden">
  <div class="landscape-gate-icon">⟳</div>
  <div class="landscape-gate-text">请将设备横过来使用<br>本游戏按横屏布局设计</div>
</div>
<div class="wrap">
  <h1><span class="seal">杀</span>极简三国杀</h1>
  <div class="sub">多 人 联 机 · 第 一 版</div>

  <!-- ============ CONFIG WARNING ============ -->
  <div id="configWarn" class="panel hidden" style="border-color:var(--cinnabar)">
    <b style="color:var(--cinnabar-bright)">还没填 Firebase 配置</b><br>
    <span style="font-size:13px;color:var(--paper-dim)">
      打开本文件,把顶部 <code>firebaseConfig</code> 换成你自己 Firebase 项目的配置,再部署。详见底部说明。
    </span>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobby" class="panel">
    <div class="row">
      <div>
        <label>房间号(玩家填同一个)</label>
        <input id="roomInput" placeholder="例如 chibi" value="chibi">
      </div>
      <div>
        <label>你的名字</label>
        <input id="nameInput" placeholder="例如 玄德">
      </div>
      <div style="flex:0 0 auto">
        <button class="primary" id="joinBtn">进入房间</button>
      </div>
    </div>
    <div id="lobbyErr" class="err"></div>
  </div>

  <!-- ============ GAME ============ -->
  <!-- 骨架级重建(landscape-ui):对手横行(#oppRow)+中央出牌区独立横条(#tableStrip,
       阶段2完成:常驻台面背景+上下分隔线,#tableCard 原样嵌套在内,负责牌内容本身的
       淡入淡出)+信息面板(阶段3会改造成独立信息条)+自己座位卡(#meSeat)+手牌行,
       取代旧版 #seats 网格环绕布局。 -->
  <div id="game" class="hidden">
    <!-- 游戏内飘牌 Canvas：z-index:0 垫底，pointer-events:none 不拦截交互 -->
    <canvas id="gameBgCanvas" aria-hidden="true"></canvas>
    <!-- 死亡动画视频：自己死亡时全屏播放随机一段(见 game-bg.js DEATH_VIDEOS)，
         不设 loop 属性,播放完毕由 game-bg.js 隐藏并恢复原背景 -->
    <video id="deathFxVideo" class="bg-video" muted playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
    <!-- 闪电判定动画视频：任意角色闪电判定出结果时全屏播放(未劈中 flash0 / 劈中 flash1，
         见 game-bg.js LIGHTNING_VIDEOS)，不设 loop 属性,播放完毕由 game-bg.js 隐藏并恢复原背景 -->
    <video id="lightningFxVideo" class="bg-video" muted playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
    <!-- 过场动画视频：武将死亡/胜负结算剧情点按 kind 播放(于吉/左慈/内奸胜，见 game-bg.js
         MOVIE_VIDEOS 与 render.js maybePlayMovieFx)，不设 loop 属性,播放完毕由 game-bg.js 隐藏 -->
    <video id="movieFxVideo" class="bg-video" muted playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
    <!-- #oppTopRow 只在宽屏桌面布局(.desktop-layout)下才会被使用(装zone==='top'的座位卡),
         窄屏下永远是空的、没有任何CSS属性的占位元素(不挂.opp-row这类会带来无条件基础样式
         的class)——render.js只有desktopLayoutActive为真时才会把座位分流进来,窄屏下
         zones本身就是null,不存在"这个座位归哪个zone"这个概念,天然不会分流任何座位进来,
         详见render.js里buildSeatDOM调用点的说明。 -->
    <div id="oppTopRow"></div>
    <div class="opp-row" id="oppRow"></div>
    <div class="table-strip" id="tableStrip">
      <div id="tableCard" class="table-card"></div>
      <div id="discardReveal" class="discard-reveal" aria-live="polite"></div>
    </div>

    <div class="panel table">
      <div class="phase-pill" id="phasePill">等待开始</div>
      <div class="deckinfo" id="deckInfo"></div>
      <div id="banner"></div>
      <div id="aiThinkingIndicator" class="hidden"></div>
      <div class="controls" id="controls"></div>
    </div>
    <!-- log-panel 挪到 .panel.table 外面(不再是它的flex子项)——桌面布局(第4步)要把它放进
         Grid 单独切出来的一整列、纵向占满全高,这需要它是 #game 的直接子元素才能参与 grid
         定位;.log-panel 的 class 选择器本身不依赖 DOM 位置(没有 .panel.table .log-panel
         这种祖先限定写法),挪到外面对窄屏/900px+浮动这两套既有样式完全不影响——它在
         .panel.table 内本来就是 flex-basis:100% 独占一行的最后一个子项,挪成同级的下一个
         兄弟节点,窄屏视觉位置不变。 -->
    <div class="log-panel" id="logPanel"></div>

    <div class="hand-label" id="myGeneral"></div>
    <div class="hand-label">你的手牌</div>
    <div class="bottom-row">
      <div id="meSeat"></div>
      <div class="hand" id="hand"></div>
    </div>
  </div>

  <div class="footnote">
    部署后,玩家各自打开同一网址、填同一房间号即可；房主也可在大厅补充机器人。<br>
    手牌只在你自己界面显示牌面;这是给朋友玩的轻量版,并非加密隐藏。
  </div>
</div>

<!-- ?v= 后面的版本号是手动维护的 cache-busting 参数:每次改动 config/data/game/render.js
     (或 index.html 里的 <style>/内联脚本)时都要顺手把这个数字改掉(改动原则见 CLAUDE.md)——
     手机浏览器对静态资源的缓存比电脑顽固得多,即使用户在自己那端硬刷新/关闭重开 App 也未必
     清得掉,查询参数不同=浏览器眼里是"新的" URL,必定重新请求,不依赖用户那侧的缓存策略。 -->

</body>
</html>
